<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTL | Наш Tier List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=Unbounded:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c11; --panel:#12151d;
  --panel2:color-mix(in srgb, var(--panel) 90%, #ffffff 7%);
  --border:color-mix(in srgb, var(--panel) 78%, #ffffff 14%);
  --text:#e9edf5; --muted:#8f97ab;
  --accent:#f59e0b; --radius:14px;
  --font:'Inter',system-ui,sans-serif; --font-head:'Unbounded',var(--font);
  --gold:#ffd700; --silver:#c7d0e0; --bronze:#cd7f32;
  --tw:520px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--border) transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(700px 340px at 85% -60px,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
button{font-family:var(--font)}
body[data-mode="view"] .edit-only{display:none !important}
#editBanner{display:none;background:color-mix(in srgb,#ffb020 16%,var(--panel));border-bottom:1px solid color-mix(in srgb,#ffb020 45%,transparent);padding:9px 22px;font-size:12.5px;font-weight:700;color:#ffd166}
body[data-mode="edit"] #editBanner{display:block}

/* ---------- LIVE ---------- */
.live{display:flex;align-items:center;gap:6px;font:800 9px var(--font);letter-spacing:1.4px;color:#3ddc84;flex:0 0 auto}
.live i{width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 10px #3ddc84;animation:pulse 1.7s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
body[data-mode="edit"] .live{display:none}

/* ---------- SPLASH ---------- */
#splash{position:fixed;inset:0;z-index:500;background:var(--bg);transition:opacity .6s ease,visibility .6s;cursor:pointer;overflow:hidden}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splashCv{position:absolute;inset:0;width:100%;height:100%}
.sp-logo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:64px;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--accent) 60%,transparent));transition:transform 1s cubic-bezier(.6,-.15,.3,1.15),opacity .8s;animation:spPop .7s cubic-bezier(.2,1.5,.4,1) both}
.sp-logo.pulse{animation:spBreathe 1.5s ease-in-out infinite}
.sp-logo.fly{transform:translate(-170vw,-80%) rotate(-30deg) scale(.45);opacity:0}
@keyframes spPop{from{transform:translate(-50%,-50%) scale(.15);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes spBreathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
.sp-bar{position:absolute;left:50%;top:56%;transform:translateX(-50%);width:180px;height:3px;background:var(--border);border-radius:3px;overflow:hidden;transition:opacity .4s}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ff6b6b);transition:width 1.7s cubic-bezier(.4,0,.2,1)}
.sp-bar.go i{width:100%}
.sp-players{position:absolute;right:6%;bottom:0;display:flex;align-items:flex-end;gap:10px;pointer-events:none;z-index:2}
.sp-fig{width:150px;height:240px;opacity:0;transform:translateY(115%);transition:transform 1s cubic-bezier(.22,1.15,.36,1),opacity .7s}
.sp-fig.in{opacity:1;transform:none}
.sp-fig .bob{width:100%;height:100%;animation:bob 3.4s ease-in-out infinite}
.sp-fig canvas{width:100%;height:100%;display:block}
.sp-fig-fb{width:110px;height:110px;margin:70px auto 0;border-radius:16px;image-rendering:pixelated;border:2px solid color-mix(in srgb,var(--accent) 50%,transparent);display:block}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.02)}}
.sp-text{position:absolute;left:50%;top:32%;transform:translate(-50%,16px);font-family:var(--font-head);font-size:clamp(20px,3.4vw,30px);font-weight:800;color:var(--text);opacity:0;transition:opacity .7s,transform .7s;text-align:center;padding:0 20px;z-index:2}
.sp-text.show{opacity:1;transform:translate(-50%,0)}
.sp-enter{position:absolute;left:50%;top:46%;transform:translate(-50%,12px);opacity:0;pointer-events:none;border:1px solid var(--accent);background:var(--accent);color:#0b0d12;font-weight:800;font-size:15px;padding:13px 28px;border-radius:12px;cursor:pointer;transition:opacity .6s,transform .6s;z-index:2}
.sp-enter.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;animation:enterGlow 2s ease-in-out infinite}
.sp-enter:hover{filter:brightness(1.12)}
@keyframes enterGlow{0%,100%{box-shadow:0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 28px rgba(245,158,11,.55)}}

/* ---------- TOPBAR + TABS ---------- */
#topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.tb-in{width:min(1240px,100%);margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--font-head);font-weight:800;font-size:18px;color:var(--accent);display:flex;gap:9px;align-items:center;cursor:pointer;white-space:nowrap;padding:16px 8px 16px 0;flex:0 0 auto}
.logo-ico{font-size:19px;transition:.2s}
.logo:hover .logo-ico{transform:rotate(-12deg) scale(1.15)}
.tabwrap{position:relative;display:flex;flex:1;min-width:0}
#tabbar{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;position:relative}
#tabbar::-webkit-scrollbar{display:none}
.tabwrap.can-scroll::after{content:'';position:absolute;right:0;top:4px;bottom:4px;width:44px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg));border-radius:10px}
.tab{display:flex;align-items:center;gap:7px;padding:17px 10px;background:none;border:0;color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:color .18s;flex:0 0 auto}
.tab .m-ico{opacity:.65;transition:.18s}
.tab:hover{color:var(--text)}
.tab:hover .m-ico{opacity:1;transform:translateY(-1px)}
.tab.active{color:var(--text)}
.tab-ind{position:absolute;bottom:0;left:0;height:2px;width:0;background:var(--accent);border-radius:2px;box-shadow:0 0 10px var(--accent);transition:left .3s cubic-bezier(.35,1.5,.4,1),width .3s cubic-bezier(.35,1.5,.4,1),opacity .2s;pointer-events:none;opacity:0}
.tab-sep{width:1px;height:22px;background:var(--border);margin:0 7px;flex:0 0 auto;align-self:center}
.m-ico{display:inline-flex;flex:0 0 auto}
.m-ico svg,.m-ico img{width:18px;height:18px;display:block}
.m-ico.txt{font-size:16px;line-height:1}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tb-gear,.tb-sound{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s}
.tb-gear:hover{color:var(--text);border-color:var(--accent);transform:rotate(45deg)}
.tb-gear.active{color:var(--accent);border-color:var(--accent)}
.tb-sound:hover{color:var(--text);border-color:var(--accent)}
.tb-sound.active{color:#3ddc84;border-color:#3ddc84}
.dd{position:relative}
.dd-btn{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:9px 13px;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s}
.dd-btn:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.dd-btn.active{color:var(--text);border-color:var(--accent)}
.dd-caret{font-size:10px;color:var(--muted);transition:transform .2s}
.dd.open .dd-caret{transform:rotate(180deg)}
.dd-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 16px 40px rgba(0,0,0,.55);z-index:60}
.dd.open .dd-menu{display:flex;flex-direction:column;gap:2px;animation:ddIn .18s ease}
@keyframes ddIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dd-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;text-align:left;width:100%;transition:.12s}
.dd-item:hover{background:var(--panel2);color:var(--text)}
.dd-item.active{color:var(--text);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.dd-item .m-ico{opacity:.8}

/* ---------- LAYOUT ---------- */
main{max-width:1240px;margin:0 auto;padding:0 22px}
#content{padding:20px 0 46px}
#footer{padding:0 22px 30px;text-align:center;color:var(--muted);font-size:12px}
#footer a{color:var(--muted);text-decoration:none;font-size:11px;opacity:.6}
#footer a:hover{opacity:1;color:var(--accent)}
.note{background:color-mix(in srgb,var(--accent) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:var(--radius);padding:11px 15px;font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.55}
.empty{padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);font-size:13.5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-width:200px;flex:1;max-width:340px}
.search input{background:none;border:0;outline:0;color:var(--text);font:500 13px var(--font);width:100%}
.f-sel{width:auto !important;min-width:140px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#0b0d12}
.btn-accent:hover{filter:brightness(1.1)}
.btn-danger{background:color-mix(in srgb,#ff4655 16%,var(--panel2));border-color:color-mix(in srgb,#ff4655 45%,transparent);color:#ff8a94}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}

/* ---------- TABLE ROWS ---------- */
.thead{display:flex;align-items:center;gap:14px;padding:6px 16px 10px;color:var(--muted);font:800 10px var(--font);letter-spacing:1.4px;text-transform:uppercase;border-bottom:1px solid var(--border);margin-bottom:10px}
.thead .col-rank,.thead .col-region,.thead .col-tiers,.thead .col-info{display:flex;align-items:center}
.thead .col-region{justify-content:center}
.thead .col-tiers{justify-content:flex-start}
.ava-spacer{width:46px;flex:0 0 auto}
.row{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s;position:relative;animation:rowIn .45s ease backwards}
@keyframes rowIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.row:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 42%,transparent);box-shadow:0 10px 26px rgba(0,0,0,.38)}
.col-rank{width:34px;flex:0 0 auto}
.rankb{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;font:800 15px var(--font-head);color:var(--muted)}
.rankb.r1{background:linear-gradient(135deg,#ffd700,#b8860b);color:#241a00;box-shadow:0 0 16px rgba(255,215,0,.25)}
.rankb.r2{background:linear-gradient(135deg,#e8edf5,#9aa7bd);color:#1a1f28}
.rankb.r3{background:linear-gradient(135deg,#e08a3c,#8c4a12);color:#1a0d00}
.col-info{flex:1;min-width:0}
.p-name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-title{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.p-title b{color:var(--c);font-weight:700}
.p-title .pts{font-variant-numeric:tabular-nums}
.tag{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.ava{width:46px;height:46px;border-radius:9px;image-rendering:pixelated;background:var(--panel2);border:1px solid var(--border);object-fit:cover;flex:0 0 auto}
.col-region{width:84px;flex:0 0 auto;display:flex;justify-content:center}
.rgn{min-width:46px;text-align:center;padding:6px 0;border-radius:7px;font:800 12px var(--font)}
.col-tiers{width:var(--tw);flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap}
.tb{width:44px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:9px;background:#0c0f15;border:1px solid var(--border);flex:0 0 auto}
.tb .m-ico svg,.tb .m-ico img{width:17px;height:17px}
.tb-lbl{font:800 9.5px var(--font);color:var(--c);letter-spacing:.3px}
.tb.empty{border-style:dashed}
.tb.empty .m-ico{opacity:.3}
.tb.big{width:58px;padding:8px 0 6px}
.tb.big .m-ico svg,.tb.big .m-ico img{width:24px;height:24px}
.tb.big .tb-lbl{font-size:12.5px}
body[data-compact="true"] .row{padding:8px 12px;margin-bottom:6px}
body[data-compact="true"] .ava{width:38px;height:38px}
body[data-compact="true"] .ava-spacer{width:38px}
@media (max-width:760px){
  .th-region,.col-region,.thead .col-region{display:none}
  .thead,.row{gap:10px}
  .th-tiers,.col-tiers{width:auto;flex:1}
  main{padding:0 12px}
  .sp-players{right:2%;gap:2px}
  .sp-fig{width:105px;height:170px}
}

/* ---------- EDITOR ---------- */
.ed-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ed-tab{border-radius:999px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--muted);transition:.15s}
.ed-tab:hover{color:var(--text)}
.ed-tab.active{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--text)}
.ed-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.ed-card h3{font-family:var(--font-head);font-size:13.5px;margin-bottom:14px;display:flex;gap:8px;align-items:center;font-weight:700}
.ed-hint{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.55}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.field label{display:block;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;font:500 13px var(--font);outline:none;transition:.15s}
.inp:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.5;font-family:'JetBrains Mono',monospace;font-size:12px}
input[type="color"]{width:44px;height:35px;padding:2px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;flex:0 0 auto}
input[type="range"]{accent-color:var(--accent);width:100%}
.ed-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--panel2);flex-wrap:wrap}
.ed-row .grow{flex:1;min-width:140px}
.icon-inp{width:170px !important;flex:0 0 auto;font-size:11px !important}
.num-inp{width:92px !important;flex:0 0 auto}
.drag{cursor:grab;color:var(--muted);font-size:15px;user-select:none}
.icon-btn{width:31px;height:31px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex:0 0 auto}
.icon-btn:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.icon-btn.danger:hover{color:#ff8a94;border-color:#ff4655}
.sw{appearance:none;width:40px;height:22px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.sw:checked{background:color-mix(in srgb,var(--accent) 60%,var(--panel2));border-color:var(--accent)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
.sw:checked::after{left:20px;background:#fff}
.sw-row{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;cursor:pointer}
.switches{display:flex;flex-wrap:wrap;gap:16px;margin-top:15px;align-items:center}
.tier-colors{display:flex;flex-wrap:wrap;gap:10px}
.tc{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:6px 8px}
.grid-add{display:flex;gap:8px;margin-bottom:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:12px;color:var(--muted);font-weight:600}
.stat b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.chip button{background:none;border:0;color:inherit;cursor:pointer;font-size:11px;opacity:.8}
.tag-add{display:flex;gap:8px}
.prev-img{width:52px;height:52px;border-radius:9px;object-fit:cover;border:1px solid var(--border);image-rendering:pixelated;background:var(--panel2)}
.file-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- PAGES ---------- */
.prose{line-height:1.75;font-size:14px}
.prose h1,.prose h2,.prose h3{font-family:var(--font-head);margin:18px 0 9px}
.prose h1{font-size:22px}.prose h2{font-size:17px;color:var(--accent)}.prose h3{font-size:14.5px}
.prose h2:first-child,.prose h3:first-child{margin-top:2px}
.prose p{margin:8px 0}
.prose ul,.prose ol{margin:8px 0 8px 22px}
.prose li{margin:4px 0}
.prose a{color:var(--accent)}
.prose hr{border:0;border-top:1px solid var(--border);margin:16px 0}
.prose blockquote{border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 10px 10px 0;padding:9px 14px;margin:10px 0;color:var(--muted);font-style:italic}
.callout{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--cc) 9%,var(--panel2));border:1px solid color-mix(in srgb,var(--cc) 38%,transparent);border-left:3px solid var(--cc);border-radius:10px;padding:11px 14px;margin:10px 0;font-size:13px;line-height:1.6}
.callout .ci{font-size:15px;flex:0 0 auto}
.pt-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
.pt-table th{text-align:left;font:800 10px var(--font);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--border)}
.pt-table td{padding:7px 10px;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.pt-table tr:last-child td{border-bottom:0}
.pt-table td b{color:var(--text)}
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{font-family:var(--font-head);font-size:23px;font-weight:800}
.page-head .ph-ico{font-size:28px}
.page-head .ph-sub{font-size:12px;color:var(--muted);margin-top:3px}

function iconHTML(icon){
  const ic=String(icon||'').trim();
  if(!ic)return `<span class="m-ico txt">🎮</span>`;
  if(ic.startsWith('<'))return `<span class="m-ico">${ic}</span>`;
  if(ic.startsWith('http'))return `<span class="m-ico"><img src="${esc(ic)}" alt="" onerror="iconFail(this)"></span>`;
  return `<span class="m-ico txt">${ic}</span>`;
}
window.iconFail=function(img){
  img.onerror=null;
  const fb=ICON_FB[img.dataset.fb]||ICON_FB.overall;
  img.src='data:image/svg+xml;utf8,'+encodeURIComponent(fb);
};

/* ================= ЗВУКИ ================= */
let SOUND_ON=localStorage.getItem(SOUND_KEY)==='1';
let AC=null;
function ensureAC(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tick(freq=760,dur=.05,vol=.05){
  if(!SOUND_ON||!AC||AC.state!=='running')return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='square';o.frequency.setValueAtTime(freq,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*.6,AC.currentTime+dur);
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur+.01);
  }catch(e){}
}
document.addEventListener('pointerdown',()=>{ensureAC();if(AC&&AC.state==='suspended')AC.resume();});

   anim: 'idle' (дышит) | 'wave' (машет) | 'arms' (расставил руки)
   rot: ракурс камеры (вправо/влево), zoom: размер
   Если позже дашь свои PNG-скины — добавь поле skin:'skins/meshnn.png' */
const SPLASH_PLAYERS=[
  {id:'p1',rot:-0.5,anim:'idle',zoom:0.85},
  {id:'p2',rot:0.12,anim:'wave',zoom:0.95},
  {id:'p4',rot:0.5,anim:'arms',zoom:0.85},
];
let splashDone=false,viewers=[],spTimers=[],spPhase=0;
function loadSkinview(){
  return new Promise((res,rej)=>{
    if(window.skinview3d)return res();
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/skinview3d@3.0.0/bundles/skinview3d.bundle.js';
    sc.onload=()=>res();sc.onerror=rej;
    document.head.appendChild(sc);
  });
}
async function buildPlayers(instant){
  const wrap=$('#spPlayers');if(wrap._built)return;wrap._built=true;
  const list=SPLASH_PLAYERS.map(c=>{const p=byId(c.id);return p?{p,c}:null;}).filter(Boolean);
  for(let i=0;i<list.length;i++){
    const {p,c}=list[i];
    const fig=document.createElement('div');fig.className='sp-fig';
    const bob=document.createElement('div');bob.className='bob';bob.style.animationDelay=(i*0.7)+'s';
    const cv=document.createElement('canvas');cv.width=150;cv.height=240;
    bob.appendChild(cv);fig.appendChild(bob);wrap.appendChild(fig);
    try{
      await loadSkinview();
      const url=c.skin||`https://minotar.net/skin/${encodeURIComponent(p.nick)}`;
      const v=new skinview3d.SkinViewer({canvas:cv,skin:url,width:150,height:240});
      v.zoom=c.zoom||0.9;v.rotation.y=c.rot||0;
      v.animation=c.anim==='wave'?new skinview3d.WavingAnimation()
                :c.anim==='arms'?new skinview3d.ArmsOutAnimation()
                :new skinview3d.IdleAnimation();
      viewers.push(v);
    }catch(e){
      cv.remove();
      const img=document.createElement('img');
      img.className='sp-fig-fb';
      img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.nick)}/120`;
      img.alt=p.nick;bob.appendChild(img);
    }
    if(instant)fig.classList.add('in');
    else setTimeout(()=>fig.classList.add('in'),200+i*500);
  }
}
function showSplash(){
  const s=$('#splash');if(!s)return;
  $('#spLogo').textContent=S.settings.logoEmoji;
  startSplashFX(()=>!splashDone);
  loadSkinview().catch(()=>{});
  const final=()=>{
    spTimers.forEach(clearTimeout);spTimers=[];
    $('#spBar').style.opacity=0;
    const lg=$('#spLogo');lg.classList.remove('pulse');lg.classList.add('fly');
    buildPlayers(true);
    $('#spText').classList.add('show');
    $('#spEnter').classList.add('show');
    spPhase=9;
  };
  s.addEventListener('click',e=>{
    if(e.target.closest('#spEnter'))return;
    if(spPhase<9)final();
  });
  $('#spEnter').addEventListener('click',e=>{e.stopPropagation();dismissSplash();});
  if(sessionStorage.getItem('htl_intro')||matchMedia('(prefers-reduced-motion: reduce)').matches){final();return;}
  requestAnimationFrame(()=>$('#spBar').classList.add('go'));
  const T=(fn,ms)=>spTimers.push(setTimeout(fn,ms));
  const N=SPLASH_PLAYERS.length;
  T(()=>{spPhase=1;$('#spBar').style.opacity=0;$('#spLogo').classList.add('pulse');},1800);
  T(()=>{spPhase=2;$('#spLogo').classList.remove('pulse');$('#spLogo').classList.add('fly');},2600);
  T(()=>{spPhase=3;buildPlayers(false);},3000);
  T(()=>{spPhase=4;$('#spText').classList.add('show');},3000+200+N*500);
  T(()=>{spPhase=5;$('#spEnter').classList.add('show');},3400+N*500);
}
function dismissSplash(){
  splashDone=true;sessionStorage.setItem('htl_intro','1');
  $('#splash').classList.add('hide');
  tick(880,.08,.06);
  setTimeout(()=>{viewers.forEach(v=>{try{v.dispose();}catch(e){}});viewers=[];},700);
}
function startSplashFX(alive){
  const cv=$('#splashCv');if(!cv)return;
  const x=cv.getContext('2d');
  const cols=Object.values(S.settings.tierColors).concat([S.settings.accent]);
  const P=[];
  for(let i=0;i<52;i++)P.push({x:Math.random(),y:Math.random()-1,s:2+Math.random()*5,v:.0016+Math.random()*.004,c:cols[i%cols.length],a:.2+Math.random()*.5,tw:Math.random()<.35?Math.random()*6:0});
  function frame(t){
    if(!alive()){cv.width=cv.height=0;return;}
    const w=cv.width=cv.clientWidth,h=cv.height=cv.clientHeight;
    x.clearRect(0,0,w,h);
    P.forEach(p=>{
      p.y+=p.v;if(p.y>1.05){p.y=-.05;p.x=Math.random();}
      x.globalAlpha=p.tw?p.a*(.45+.55*Math.abs(Math.sin(t*.002+p.tw))):p.a;
      x.fillStyle=p.c;x.fillRect(Math.round(p.x*w),Math.round(p.y*h),p.s,p.s);
    });
    x.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function upgradeIcon(m){
  const ic=String(m.icon||'').trim();
  if(!ic)return OFFICIAL[m.id]||'🎮';
  if(!ic.startsWith('<')&&!ic.startsWith('http'))return OFFICIAL[m.id]||ic;
  if(ic.startsWith('<')&&OLD_DEFAULT_ICONS[m.id]===ic)return OFFICIAL[m.id]||ic;
  return m.icon;
}
function normalize(o){
  const d=clone(DEFAULTS);
  if(!o||typeof o!=='object')return d;
  d.settings=Object.assign(clone(DEFAULTS.settings),o.settings||{});
  d.settings.tierColors=Object.assign(clone(DEFAULTS.settings.tierColors),(o.settings||{}).tierColors||{});
  d.points=Object.assign(clone(DEFAULTS.points),o.points||{});
  ['titles','modes','nav','pages','players'].forEach(k=>{if(Array.isArray(o[k]))d[k]=o[k];});
  if(Array.isArray(o.grids))d.grids=o.grids.map(g=>({id:g.id||uid(),name:g.name||'Сетка',icon:g.icon||'🏆',auto:!!g.auto,autoCount:Math.max(1,+g.autoCount||3),players:Array.isArray(g.players)?g.players:[]}));
  d.modes.forEach(m=>{m.icon=upgradeIcon(m);});
  d.pages=d.pages.map(normalizePage);
  d.players.forEach(p=>{p.tiers=p.tiers||{};p.tags=p.tags||[];p.bio=p.bio||'';});
  d.nav=d.nav.filter(n=>n&&(n.kind==='top'||n.kind==='overall'||(n.kind==='mode'&&d.modes.some(m=>m.id===n.ref))||(n.kind==='page'&&d.pages.some(p=>p.id===n.ref))));
  if(!d.nav.some(n=>n.kind==='top'))d.nav.unshift({kind:'top'});
  if(!d.nav.some(n=>n.kind==='overall'))d.nav.splice(1,0,{kind:'overall'});
  d._seeded=!!o._seeded;
  return d;
}

  r.setProperty('--accent',st.accent);r.setProperty('--bg',st.bg);r.setProperty('--panel',st.panel);

function navMeta(n){
  if(n.kind==='top')return{icon:n.icon||'🏆',label:n.label||'Топ / Сетки',page:'top'};
  if(n.kind==='overall')return{icon:n.icon||OFFICIAL.overall,label:n.label||'Overall',page:'overall'};
  if(n.kind==='mode'){const m=mode(n.ref);return m?{icon:m.icon,label:m.name,page:m.id}:null;}
  if(n.kind==='page'){const p=page(n.ref);return p?{icon:p.icon,label:p.title,page:p.id}:null;}

function updateScrollFade(){
  const w=$('#tabwrap'),t=$('#tabbar');
  if(!t||!w)return;
  w.classList.toggle('can-scroll',t.scrollWidth>t.clientWidth+4);
}
function updateIndicator(center){
  const bar=$('#tabbar'),ind=$('#tabInd');
  const act=bar.querySelector('.tab.active');
  if(!act){ind.style.opacity=0;return;}
  ind.style.opacity=1;
  ind.style.left=act.offsetLeft+'px';
  ind.style.width=act.offsetWidth+'px';
  if(center){
    const x=act.offsetLeft-bar.clientWidth/2+act.offsetWidth/2;
    bar.scrollTo({left:Math.max(0,Math.min(x,bar.scrollWidth)),behavior:'smooth'});
  }
}
function renderTabs(){
  const pnav=S.settings.pagesInNav||'dropdown';
  let html=S.nav.map(n=>{
    if(n.kind==='page'&&pnav!=='tabs')return '';

/* ================= COUNT-UP ================= */
function animatePoints(){
  const els=[...document.querySelectorAll('.pts')];
  els.forEach((el,i)=>{
    const target=+el.dataset.v||0;
    if(!target){el.textContent=0;return;}
    const dur=650,delay=Math.min(i*40,400);
    el.textContent='0';
    setTimeout(()=>{
      const s=performance.now();
      function step(n){
        const p=Math.min(1,(n-s)/dur);
        const e=1-Math.pow(1-p,3);
        el.textContent=Math.round(target*e);
        if(p<1)requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    },delay);
  });
}

/* ================= БЕЙДЖИ / СТРОКИ ================= */
function tb(modeId,tier,big){
  const m=mode(modeId);
  let ic=iconHTML(m?m.icon:'🎮');
  ic=ic.replace('class="m-ico"','class="m-ico" data-fb="'+(m?m.id:'')+'"').replace('<img ','<img data-fb="'+(m?m.id:'')+'" ');
  if(!tier)return `<span class="tb empty${big?' big':''}">${ic}<span class="tb-lbl" style="color:var(--muted)">–</span></span>`;
  const c=S.settings.tierColors[tier]||'#8f97ab';
  return `<span class="tb${big?' big':''}" style="--c:${c}">${ic}<span class="tb-lbl">${tier}</span></span>`;
}
function rowHTML(p,rank,showAll,idx){
  const pts=points(p),t=titleFor(pts),st=S.settings;
  const tags=st.showTags&&p.tags.length?p.tags.map(tg=>`<span class="tag" style="--c:${tagColor(tg)}">${esc(tg)}</span>`).join(''):'';
  const ptsSpan=`<span class="pts" data-v="${pts}">${pts}</span>`;
  const titleLine=st.showTitles?`<div class="p-title" style="--c:${t.color}">${t.emoji} <b>${esc(t.name)}</b>${st.showPoints?`<span>(${ptsSpan} очков)</span>`:''}</div>`:(st.showPoints?`<div class="p-title"><span>(${ptsSpan} очков)</span></div>`:'');
  const badges=showAll?S.modes.map(m=>tb(m.id,p.tiers[m.id])).join(''):tb(UI.page,p.tiers[UI.page],true);
  const rc=REGION_COLORS[p.region]||'#8f97ab';
  const region=st.showRegions?`<span class="rgn" style="background:${hexA(rc,.2)};border:1px solid ${hexA(rc,.5)};color:${rc}">${esc(p.region||'—')}</span>`:'';
  const rankCls=rank<=3?' r'+rank:'';
  const delay=Math.min((idx||0)*45,450);
  return `<div class="row" data-player="${p.id}" style="animation-delay:${delay}ms">
    <div class="col-rank"><div class="rankb${rankCls}">${rank}</div></div>
    <img class="ava" src="${skinSrc(p)}" onerror="this.onerror=null;this.src=window.DEFAULT_AVA" alt="">
    <div class="col-info"><div class="p-name">${esc(p.nick)} <span>${flag(p.country)}</span> ${tags}</div>${titleLine}</div>
    <div class="col-region">${region}</div>
    <div class="col-tiers">${badges}</div>
  </div>`;
}
const thead=showAll=>`<div class="thead">
  <div class="col-rank">#</div><div class="ava-spacer"></div>
  <div class="col-info">Игрок</div>
  <div class="col-region">Регион</div>

/* ================= СТРАНИЦЫ ================= */
function fmt(t){let h=esc(t);h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');h=h.replace(/`([^`]+)`/g,'<code>$1</code>');h=h.replace(/\*([^*]+)\*/g,'<i>$1</i>');h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');return h.replace(/\n/g,'<br>');}
function tiersTableHTML(){return `<table class="pt-table"><tr><th>Тир</th><th>Очки</th></tr>${TIERS.map(t=>`<tr><td><b style="color:${S.settings.tierColors[t]}">${t}</b></td><td><b>${S.points[t]}</b></td></tr>`).join('')}</table>`;}
function titlesTableHTML(){return `<table class="pt-table"><tr><th>Звание</th><th>Минимум очков</th></tr>${[...S.titles].sort((a,b)=>b.min-a.min).map(t=>`<tr><td><span style="color:${t.color};font-weight:700">${t.emoji} ${esc(t.name)}</span></td><td><b>${t.min}+</b></td></tr>`).join('')}</table>`;}
function blockHTML(b){switch(b.type){
  case 'h2':return `<h2>${fmt(b.text)}</h2>`;case 'h3':return `<h3>${fmt(b.text)}</h3>`;case 'p':return `<p>${fmt(b.text)}</p>`;
  case 'list':return `<${b.ordered?'ol':'ul'}>${(b.items||[]).filter(x=>x.trim()).map(i=>`<li>${fmt(i)}</li>`).join('')}</${b.ordered?'ol':'ul'}>`;
  case 'note':{const n=NOTE_TONES[b.tone]||NOTE_TONES.info;return `<div class="callout" style="--cc:${n.c}"><span class="ci">${n.i}</span><span>${fmt(b.text)}</span></div>`;}
  case 'quote':return `<blockquote>${fmt(b.text)}</blockquote>`;case 'divider':return `<hr>`;
  case 'tiers':return tiersTableHTML();case 'titles':return titlesTableHTML();
  case 'html':return b.code||'';default:return '';}}
const pageBlocksHTML=p=>(p.blocks||[]).map(blockHTML).join('');
function renderPageView(p){
  return `<div class="page-head"><span class="ph-ico">${iconHTML(p.icon)}</span>
    <div><h1>${esc(p.title)}</h1><div class="ph-sub">${esc(p.subtitle||'')}${p.updated?' • обновлено '+fmtDate(p.updated):''}</div></div>
    ${EDIT_MODE?`<button class="btn btn-sm edit-only" style="margin-left:auto" data-act="editPage" data-id="${p.id}">✏️ Редактировать</button>`:''}
  </div><div class="ed-card prose">${pageBlocksHTML(p)||'<div class="empty">Страница пуста — добавь блоки в редакторе.</div>'}</div>`;
}
function renderPage(){
  const c=$('#content');
  if(UI.page==='editor'){if(!EDIT_MODE){UI.page='top';}else{c.innerHTML=renderEditor();updateChrome();return;}}
  if(UI.page==='top')c.innerHTML=renderTop();
  else if(UI.page==='overall'||mode(UI.page))c.innerHTML=renderRanking(UI.page);
  else if(page(UI.page))c.innerHTML=renderPageView(page(UI.page));
  else{UI.page='top';c.innerHTML=renderTop();}
  updateChrome();
  if(UI.animatePts&&(UI.page==='top'||UI.page==='overall'))animatePoints();
  UI.animatePts=false;
}
function renderTop(){
  let offset=1;
  const actions=EDIT_MODE?`<div class="toolbar" style="justify-content:flex-end"><button class="btn edit-only" data-act="gridsOpen">⚙️ Настроить сетки</button></div>`:'';
  if(!S.grids.length)return actions+`<div class="empty">Сеток пока нет.</div>`;
  const html=S.grids.map(g=>{
    const list=g.auto?overallSorted().slice(0,Math.max(1,g.autoCount||3)):g.players.map(byId).filter(Boolean);
    const collapsed=UI.collapsed.has(g.id);
    const head=`<div class="thead clickable" data-act="gridCollapse" data-id="${g.id}" style="cursor:pointer;user-select:none">
      <div class="col-rank">${g.icon||'🏆'}</div><div class="ava-spacer"></div>
      <div class="col-info">${esc(g.name)}${g.auto?' <span class="tag" style="--c:var(--accent)">AUTO</span>':''} <span class="muted">(${list.length})</span></div>
      <div class="col-region">Регион</div>
      <div class="col-tiers">Тиры <span style="margin-left:6px">${collapsed?'▸':'▾'}</span></div></div>`;
    const body=collapsed?'':(list.length?list.map((p,i)=>rowHTML(p,offset+i,true,i)).join(''):`<div class="empty">Пусто — добавь игроков в редакторе сеток ⚙️</div>`);
    offset+=list.length;
    return head+body;
  }).join('');

function renderRanking(key){
  let list=[...S.players];
  if(key!=='overall')list=list.filter(p=>p.tiers[key]);
  if(UI.region)list=list.filter(p=>p.region===UI.region);
  if(UI.country)list=list.filter(p=>p.country===UI.country);
  const base=list;
  const q=UI.search.trim().toLowerCase();
  if(q)list=list.filter(p=>p.nick.toLowerCase().includes(q)||p.tags.join(' ').toLowerCase().includes(q));
  if(key==='overall'){
    if(UI.sort==='name')list.sort((a,b)=>a.nick.localeCompare(b.nick));
    else if(UI.sort==='best')list.sort((a,b)=>bestTier(a)-bestTier(b)||points(b)-points(a));
    else list.sort((a,b)=>points(b)-points(a)||a.nick.localeCompare(b.nick));
  }else list.sort((a,b)=>TIERS.indexOf(a.tiers[key])-TIERS.indexOf(b.tiers[key])||points(b)-points(a));
  const countries=[...new Set(S.players.map(p=>p.country).filter(Boolean))];
  const bar=`<div class="toolbar">
    <div class="search">🔍<input id="searchInput" placeholder="Поиск игрока..." value="${esc(UI.search)}" autocomplete="off"></div>
    <select class="inp f-sel" id="fRegion"><option value="">🌍 Все регионы</option>${REGIONS.map(r=>`<option${UI.region===r?' selected':''}>${r}</option>`).join('')}</select>
    <select class="inp f-sel" id="fCountry"><option value="">🚩 Все страны</option>${countries.map(c=>`<option value="${c}"${UI.country===c?' selected':''}>${flag(c)} ${COUNTRIES[c]||c}</option>`).join('')}</select>
    ${key==='overall'?`<select class="inp f-sel" id="fSort"><option value="points"${UI.sort==='points'?' selected':''}>🧮 По очкам</option><option value="best"${UI.sort==='best'?' selected':''}>🏅 По лучшему тиру</option><option value="name"${UI.sort==='name'?' selected':''}>🔤 По нику</option></select>`:''}
    ${EDIT_MODE?`<button class="btn btn-accent edit-only" data-act="addPlayer">➕ Добавить игрока</button>`:''}
    <span class="muted" style="font-size:12px;margin-left:auto">Найдено: ${list.length}</span>
  </div>`;
  const stats=key!=='overall'?`<div class="toolbar">${TIERS.map(t=>{const n=base.filter(p=>p.tiers[key]===t).length;return n?`<span class="tb" style="--c:${S.settings.tierColors[t]}"><span class="tb-lbl">${t}</span><span class="tb-lbl" style="color:var(--muted)">×${n}</span></span>`:'';}).join('')}</div>`:'';
  const note=key==='overall'?`<div class="note">${esc(S.settings.overallNote)}</div>`:'';
  return note+bar+stats+thead(key==='overall')+(list.length?list.map((p,i)=>rowHTML(p,i+1,key==='overall',i)).join(''):`<div class="empty">Никого нет 🔍</div>`);
}

/* ================= ПРИВЯЗКИ ================= */
function refreshPreviews(){
  document.querySelectorAll('[data-for]').forEach(el=>{
    const bind=el.dataset.for;
    const src=document.querySelector(`[data-prev="${bind}"]`);
    if(src)el.innerHTML=iconHTML(src.value);
  });
}
function bindSet(path,el){
  const i=path.indexOf(':');const key=i<0?path:path.slice(0,i);const arg=i<0?'':path.slice(i+1);
  let v=el.type==='checkbox'?el.checked:(el.type==='number'||el.type==='range')?+el.value:el.value;
  if(key.startsWith('blk')){
    const [pid,bid]=arg.split('|');const p=page(pid);if(!p)return;const b=p.blocks.find(x=>x.id===bid);if(!b)return;
    if(key==='blkText')b.text=v;if(key==='blkTone')b.tone=v;if(key==='blkItems')b.items=v.split('\n');if(key==='blkCode')b.code=v;if(key==='blkOrdered')b.ordered=el.checked;
    save();const prev=$('#blkPrev-'+pid);if(prev)prev.innerHTML=pageBlocksHTML(p);return;
  }
  switch(key){
    case 'set':S.settings[arg]=v;break;
    case 'tierColor':S.settings.tierColors[arg]=v;break;
    case 'points':S.points[arg]=v;break;
    case 'modeName':mode(arg).name=v;break;
    case 'modeIcon':mode(arg).icon=v;break;
    case 'titleName':S.titles.find(t=>t.id===arg).name=v;break;
    case 'titleEmoji':S.titles.find(t=>t.id===arg).emoji=v;break;
    case 'titleMin':S.titles.find(t=>t.id===arg).min=v;break;
    case 'titleColor':S.titles.find(t=>t.id===arg).color=v;break;
    case 'navIcon':S.nav[+arg].icon=v;break;
    case 'navLabel':S.nav[+arg].label=v;break;
    case 'navHidden':S.nav[+arg].hidden=el.checked;break;
    case 'pageIcon':page(arg).icon=v;break;
    case 'pageTitle':page(arg).title=v;break;
    case 'pageSub':page(arg).subtitle=v;break;
    case 'gridName':grid(arg).name=v;break;
    case 'gridIcon':grid(arg).icon=v;break;
    case 'gridAuto':grid(arg).auto=el.checked;break;
    case 'gridCount':grid(arg).autoCount=Math.max(1,+el.value||1);break;
  }
  save();applyTheme();renderTabs();updateChrome();refreshPreviews();
  if(key==='gridAuto')renderPage();
}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.bind)bindSet(e.target.dataset.bind,e.target);});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.bind&&(t.type==='checkbox'||t.tagName==='SELECT'))bindSet(t.dataset.bind,t);
  if(t.id==='fRegion'){UI.region=t.value;renderPage();}
  if(t.id==='fCountry'){UI.country=t.value;renderPage();}
  if(t.id==='fSort'){UI.sort=t.value;renderPage();}
});

/* ================= ДЕЙСТВИЯ ================= */
function act(a,el){
  const id=el.dataset.id,dir=+el.dataset.dir||0,idx=+el.dataset.idx,g=el.dataset.grid;
  switch(a){
    case 'goto':UI.page=id;UI.search='';UI.animatePts=true;$('#pagesDD').classList.remove('open');renderTabs();renderPage();setHash('#/'+id);requestAnimationFrame(()=>updateIndicator(true));window.scrollTo({top:0});break;
    case 'toggleDD':$('#pagesDD').classList.toggle('open');tick(640,.04,.04);break;
    case 'edTab':UI.edTab=id;renderPage();break;
    case 'gridsOpen':UI.page='editor';UI.edTab='grids';renderTabs();renderPage();setHash('#/editor');break;
    case 'closeModal':closeModal(id);break;
    case 'confirmYes':closeModal('confirmModal');if(_cf){const f=_cf;_cf=null;f();}break;
    case 'addPlayer':if(!EDIT_MODE)break;openForm(null);break;
    case 'editPlayer':if(!EDIT_MODE)break;closeModal('playerModal');openForm(id);break;
    case 'delPlayer':{if(!EDIT_MODE)break;const p=byId(id);if(!p)break;showConfirm(`Удалить игрока ${p.nick}?`,()=>{S.players=S.players.filter(x=>x.id!==id);S.grids.forEach(gr=>gr.players=gr.players.filter(x=>x!==id));save();closeModal('playerModal');renderAll();toast('🗑 Игрок удалён');});break;}
    case 'downloadCard':downloadCard(id);break;
    case 'copyLink':setHash('#/player/'+id);if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>toast('🔗 Ссылка скопирована')).catch(()=>toast('⚠️ Не удалось скопировать ссылку',true));else toast('⚠️ Буфер обмена недоступен',true);break;
    case 'addMode':{const m={id:uid(),name:'Новый режим',icon:'🎮'};S.modes.push(m);S.nav.push({kind:'mode',ref:m.id});save();setTierVar();renderTabs();renderPage();toast('⚔️ Режим добавлен');break;}
    case 'delMode':{const m=mode(id);showConfirm(`Удалить режим «${m.name}»? Оценки игроков в нём тоже удалятся.`,()=>{S.modes=S.modes.filter(x=>x.id!==id);S.nav=S.nav.filter(n=>!(n.kind==='mode'&&n.ref===id));S.players.forEach(p=>delete p.tiers[id]);if(UI.page===id)UI.page='overall';save();setTierVar();renderAll();toast('🗑 Режим удалён');});break;}
    case 'moveMode':{const i=S.modes.findIndex(m=>m.id===id),j=i+dir;if(j<0||j>=S.modes.length)break;[S.modes[i],S.modes[j]]=[S.modes[j],S.modes[i]];save();renderPage();break;}
    case 'addTitle':S.titles.push({id:uid(),name:'Новое звание',emoji:'👑',color:'#8f97ab',min:0});save();renderPage();toast('👑 Звание добавлено');break;
    case 'delTitle':showConfirm('Удалить это звание?',()=>{S.titles=S.titles.filter(t=>t.id!==id);save();renderPage();toast('🗑 Звание удалено');});break;
    case 'addPage':{const p=mkPage('Новая страница','📄','',[mkBlock('h2'),mkBlock('p')]);S.pages.push(p);S.nav.push({kind:'page',ref:p.id});save();renderTabs();renderPage();toast('📄 Страница добавлена');break;}
    case 'tpl':{const f={rules:tplRules,calib:tplCalib,changelog:tplChangelog}[el.dataset.tpl];if(!f)break;const p=f();S.pages.push(p);S.nav.push({kind:'page',ref:p.id});UI.pageEdit=p.id;save();renderTabs();renderPage();toast('📋 Шаблон создан');break;}
    case 'delPage':showConfirm('Удалить эту страницу и её пункт из меню?',()=>{S.pages=S.pages.filter(p=>p.id!==id);S.nav=S.nav.filter(n=>!(n.kind==='page'&&n.ref===id));if(UI.page===id)UI.page='top';if(UI.pageEdit===id)UI.pageEdit=null;save();renderAll();toast('🗑 Страница удалена');});break;
    case 'editPage':UI.page='editor';UI.edTab='pages';UI.pageEdit=id;renderTabs();renderPage();setHash('#/editor');break;
    case 'toggleBlocks':UI.pageEdit=UI.pageEdit===id?null:id;renderPage();break;
    case 'dupPage':{const i=S.pages.findIndex(p=>p.id===id);const c=clone(S.pages[i]);c.id=uid();c.title=c.title+' (копия)';c.blocks=c.blocks.map(b=>({...b,id:uid()}));c.updated=Date.now();S.pages.splice(i+1,0,c);S.nav.push({kind:'page',ref:c.id});save();renderTabs();renderPage();toast('⧉ Страница продублирована');break;}
    case 'movePage':{const i=S.pages.findIndex(p=>p.id===id),j=i+dir;if(j<0||j>=S.pages.length)break;[S.pages[i],S.pages[j]]=[S.pages[j],S.pages[i]];
      const ni=S.nav.findIndex(n=>n.kind==='page'&&n.ref===id);const nj=S.nav.findIndex(n=>n.kind==='page'&&n.ref===S.pages[i].id);
      if(nj>=ni){S.nav.splice(ni+1,0,S.nav.splice(nj,1)[0]);}else{S.nav.splice(ni,0,S.nav.splice(nj+1,1)[0]);}
      save();renderTabs();renderPage();break;}
    case 'addBlock':{const p=page(id);p.blocks.push(mkBlock(el.dataset.type));p.updated=Date.now();save();renderPage();break;}
    case 'delBlock':{const p=page(el.dataset.pid);const bi=p.blocks.findIndex(b=>b.id===el.dataset.bid);p.blocks.splice(bi,1);p.updated=Date.now();save();renderPage();break;}
    case 'moveBlock':{const p=page(el.dataset.pid);const bi=p.blocks.findIndex(b=>b.id===el.dataset.bid),bj=bi+dir;if(bj<0||bj>=p.blocks.length)break;[p.blocks[bi],p.blocks[bj]]=[p.blocks[bj],p.blocks[bi]];save();renderPage();break;}
    case 'moveNav':{const j=idx+dir;if(j<0||j>=S.nav.length)break;[S.nav[idx],S.nav[j]]=[S.nav[j],S.nav[idx]];save();renderTabs();renderPage();break;}
    case 'addGrid':S.grids.push({id:uid(),name:'Новая сетка',icon:'🏆',auto:false,autoCount:3,players:[]});save();renderPage();toast('🏆 Сетка добавлена');break;
    case 'delGrid':{const gr=grid(id);showConfirm(`Удалить сетку «${gr.name}»? Игроки останутся в базе.`,()=>{S.grids=S.grids.filter(x=>x.id!==id);save();renderPage();toast('🗑 Сетка удалена');});break;}
    case 'dupGrid':{const i=S.grids.findIndex(x=>x.id===id);const c=clone(S.grids[i]);c.id=uid();c.name=c.name+' (копия)';S.grids.splice(i+1,0,c);save();renderPage();toast('⧉ Сетка продублирована');break;}
    case 'moveGrid':{const i=S.grids.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=S.grids.length)break;[S.grids[i],S.grids[j]]=[S.grids[j],S.grids[i]];save();renderPage();break;}
    case 'gridCollapse':UI.collapsed.has(id)?UI.collapsed.delete(id):UI.collapsed.add(id);renderPage();break;
    case 'gridAdd':{const v=$('#gs-'+g).value;const gr=grid(g);if(v&&!gr.players.includes(v)){gr.players.push(v);save();renderPage();}break;}
    case 'gridDel':grid(g).players.splice(idx,1);save();renderPage();break;
    case 'gridMove':{const gr=grid(g),j=idx+dir;if(j<0||j>=gr.players.length)break;[gr.players[idx],gr.players[j]]=[gr.players[j],gr.players[idx]];save();renderPage();break;}
    case 'downloadData':{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='data.json';a2.click();URL.revokeObjectURL(a2.href);toast('📥 data.json скачан — замени им файл в репозитории');break;}
    case 'import':$('#importFile').click();break;
    case 'clearDraft':showConfirm('Очистить локальный черновик? Сайт снова будет брать данные из data.json.',()=>{localStorage.removeItem(DRAFT_KEY);toast('🗑 Черновик очищен');setTimeout(()=>location.href=location.pathname,900);});break;
    case 'reset':showConfirm('Сбросить ВСЁ к начальному состоянию?',()=>{S=clone(DEFAULTS);S._seeded=false;seedPages();save();UI.page='top';renderAll();toast('↺ Сайт сброшен');});break;
    case 'resetTheme':showConfirm('Сбросить оформление к стандартному?',()=>{S.settings=clone(DEFAULTS.settings);save();applyTheme();renderTabs();renderPage();toast('🎨 Оформление сброшено');});break;
    case 'pfAddTag':pfAddTag();break;
    case 'pfDelTag':PF.tags.splice(idx,1);pfTags();break;
    case 'pfSkinPick':$('#pfSkinFile').click();break;
    case 'pfBgPick':$('#pfBgFile').click();break;
    case 'pfSkinClear':PF.skin='';pfPrev();break;
    case 'pfBgClear':PF.bg='';pfPrev();break;
    case 'pfSave':pfSave();break;
  }
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#pagesDD'))$('#pagesDD')&&$('#pagesDD').classList.remove('open');
  const a=e.target.closest('[data-act]');
  if(a){e.preventDefault();act(a.dataset.act,a);return;}
  const r=e.target.closest('[data-player]');
  if(r){openPlayer(r.dataset.player);return;}
  if(e.target.classList&&e.target.classList.contains('modal'))closeModal(e.target.id);
});
$('#soundBtn').addEventListener('click',()=>{
  SOUND_ON=!SOUND_ON;
  localStorage.setItem(SOUND_KEY,SOUND_ON?'1':'0');
  ensureAC();updateSoundBtn();
  if(SOUND_ON)tick(900,.06,.06);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.querySelectorAll('.modal.open').forEach(m=>closeModal(m.id));$('#pagesDD').classList.remove('open');}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$('#searchInput')){e.preventDefault();$('#searchInput').focus();}
});
const content=$('#content');
content.addEventListener('dragstart',e=>{const r=e.target.closest('[data-navrow]');if(r){UI.drag=+r.dataset.navrow;e.dataTransfer.effectAllowed='move';}});
content.addEventListener('dragover',e=>{if(e.target.closest('[data-navrow]'))e.preventDefault();});
content.addEventListener('drop',e=>{const r=e.target.closest('[data-navrow]');if(r&&UI.drag!==null){const to=+r.dataset.navrow;const [it]=S.nav.splice(UI.drag,1);S.nav.splice(to,0,it);UI.drag=null;save();renderTabs();renderPage();}});
content.addEventListener('input',e=>{if(e.target.id==='searchInput'){UI.search=e.target.value;renderPage();setTimeout(()=>{const s=$('#searchInput');if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length);}},0);}});

/* ================= ХЭШ ================= */
function setHash(h){if(location.hash!==h)location.hash=h;}
function applyHash(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(h.startsWith('player/')){const id=h.slice(7);if(byId(id)){openPlayer(id);return;}}
  if(h){const ok=h==='top'||h==='overall'||h==='editor'||mode(h)||page(h);
    if(ok){if(UI.page!==h){UI.page=h;UI.animatePts=true;renderTabs();renderPage();requestAnimationFrame(()=>updateIndicator(true));}closeModal('playerModal');}}
}
window.addEventListener('hashchange',applyHash);

/* ================= МОДАЛКА ИГРОКА ================= */
function openPlayer(id){
  const p=byId(id);if(!p)return;
  const pts=points(p),t=titleFor(pts);
  const rc=REGION_COLORS[p.region]||'#8f97ab';
  $('#pmBody').innerHTML=`
  <div class="pc-head"${p.bg?` style="background-image:url('${p.bg}')"`:''}><div class="pc-in">
    <img class="pc-ava" src="${skinSrc(p)}" onerror="this.onerror=null;this.src=window.DEFAULT_AVA" alt="">
    <div style="min-width:0">
      <div class="pc-name">${esc(p.nick)} <span>${flag(p.country)}</span></div>
      <div class="pc-tags">${p.tags.map(tg=>`<span class="tag" style="--c:${tagColor(tg)}">${esc(tg)}</span>`).join('')}</div>
      <div class="pc-title" style="--c:${t.color}">${t.emoji} ${esc(t.name)} <span class="muted">(${pts} очков)</span></div>
      <div class="pc-loc"><span class="rgn" style="background:${hexA(rc,.2)};border:1px solid ${hexA(rc,.5)};color:${rc}">${esc(p.region||'—')}</span>
      <span class="pc-loc-t">${flag(p.country)} ${esc(regionText(p))}</span></div>
    </div>
  </div></div>
  ${p.bio?`<div class="pc-bio">${esc(p.bio)}</div>`:''}
  <div class="tiers-grid">${S.modes.map(m=>`<div class="tg-cell"><span>${iconHTML(m.icon)}</span>${esc(m.name)}${tb(m.id,p.tiers[m.id])}</div>`).join('')}</div>
  <div class="modal-actions">
    <button class="btn" data-act="downloadCard" data-id="${p.id}">📸 Скачать карточку</button>
    <button class="btn" data-act="copyLink" data-id="${p.id}">🔗 Ссылка</button>
    ${EDIT_MODE?`<button class="btn edit-only" data-act="editPlayer" data-id="${p.id}">✏️ Изменить</button><button class="btn btn-danger edit-only" data-act="delPlayer" data-id="${p.id}">🗑 Удалить</button>`:''}
  </div>`;
  openModal('playerModal');setHash('#/player/'+id);
}

/* ================= ФОРМА ИГРОКА ================= */
function openForm(id){
  PF=id?clone(byId(id)):{id:null,nick:'',country:'RU',city:'',region:'EU',tags:[],bio:'',skin:'',bg:'',tiers:{}};
  $('#pfTitle').textContent=id?'Изменить игрока':'Новый игрок';
  $('#pfNick').value=PF.nick;$('#pfCity').value=PF.city||'';$('#pfBio').value=PF.bio||'';
  $('#pfCountry').innerHTML=Object.entries(COUNTRIES).map(([c,n])=>`<option value="${c}"${PF.country===c?' selected':''}>${flag(c)} ${c} — ${n}</option>`).join('');
  $('#pfRegion').innerHTML=REGIONS.map(r=>`<option${PF.region===r?' selected':''}>${r}</option>`).join('');
  $('#pfTagInput').value='';pfTags();pfPrev();
  $('#pfTiers').innerHTML=S.modes.map(m=>field(`${iconHTML(m.icon)} ${esc(m.name)}`,`<select class="inp" data-mode="${m.id}"><option value="">— Unranked</option>${TIERS.map(t=>`<option${PF.tiers[m.id]===t?' selected':''}>${t}</option>`).join('')}</select>`)).join('');
  openModal('playerForm');setTimeout(()=>$('#pfNick').focus(),60);
}
function pfTags(){$('#pfTags').innerHTML=PF.tags.map((t,i)=>`<span class="chip" style="--c:${tagColor(t)}">${esc(t)}<button data-act="pfDelTag" data-idx="${i}">✕</button></span>`).join('')||'<span class="muted" style="font-size:12px">Тегов пока нет</span>';}
function pfAddTag(){const v=$('#pfTagInput').value.trim();if(v){PF.tags.push(v);$('#pfTagInput').value='';pfTags();}}
function pfPrev(){const s=$('#pfSkinPrev'),b=$('#pfBgPrev');s.style.display=PF.skin?'':'none';if(PF.skin)s.src=PF.skin;b.style.display=PF.bg?'':'none';if(PF.bg)b.src=PF.bg;}
function pfSave(){
  const nick=$('#pfNick').value.trim();
  if(!nick){toast('⚠️ Введи ник игрока',true);return;}
  const tiers={};$('#pfTiers').querySelectorAll('select[data-mode]').forEach(s=>{if(s.value)tiers[s.dataset.mode]=s.value;});
  const data={nick,country:$('#pfCountry').value,city:$('#pfCity').value.trim(),region:$('#pfRegion').value,tags:[...PF.tags],bio:$('#pfBio').value.trim(),skin:PF.skin,bg:PF.bg,tiers};
  if(PF.id){Object.assign(byId(PF.id),data);}else{S.players.push(Object.assign({id:uid()},data));}
  save();closeModal('playerForm');renderAll();toast('💾 Сохранено в черновик — не забудь скачать data.json');
}
$('#pfTagInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();pfAddTag();}});
function readFile(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file);}
$('#pfSkinFile').addEventListener('change',e=>{readFile(e.target.files[0],d=>{PF.skin=d;pfPrev();});e.target.value='';});
$('#pfBgFile').addEventListener('change',e=>{readFile(e.target.files[0],d=>{PF.bg=d;pfPrev();});e.target.value='';});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.players))throw 0;S=normalize(o);seedPages();save();renderAll();toast('📥 Файл загружен в черновик');}catch(err){toast('⚠️ Некорректный JSON-файл',true);}};
  r.readAsText(f);
});

/* ================= КАРТОЧКА PNG ================= */
function loadImg(src,cors=false){return new Promise((res,rej)=>{const i=new Image();if(cors&&/^https?:/i.test(src))i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function drawCover(x,img,W,H){const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,(W-w)/2,(H-h)/2,w,h);}
const fnt=(w,s,f)=>`${w} ${s}px "${f}", sans-serif`;
async function downloadCard(id){
  const p=byId(id);if(!p)return;
  toast('🎨 Рисую карточку...');
  const st=S.settings,W=1200,H=630,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const bg=p.bg?await loadImg(p.bg).catch(()=>null):null;
  if(bg){drawCover(x,bg,W,H);x.fillStyle='rgba(6,8,12,.62)';x.fillRect(0,0,W,H);}
  else{const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,st.panel);g.addColorStop(1,st.bg);x.fillStyle=g;x.fillRect(0,0,W,H);
    const rg=x.createRadialGradient(W-160,90,10,W-160,90,540);rg.addColorStop(0,hexA(st.accent,.26));rg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);}
  x.strokeStyle=hexA(st.accent,.5);x.lineWidth=2;rr(x,10,10,W-20,H-20,24);x.stroke();
  const skin=await loadImg(skinSrc(p),true).catch(()=>null);
  x.save();rr(x,64,64,176,176,20);x.clip();
  if(skin)x.drawImage(skin,64,64,176,176);
  else{x.fillStyle=st.panel;x.fillRect(64,64,176,176);x.fillStyle=st.accent;x.font=fnt(800,90,st.headFont);x.textAlign='center';x.fillText((p.nick[0]||'?').toUpperCase(),152,185);x.textAlign='left';}
  x.restore();x.strokeStyle=hexA(st.accent,.7);x.lineWidth=3;rr(x,64,64,176,176,20);x.stroke();
  const pts=points(p),t=titleFor(pts);
  x.fillStyle='#e9edf5';x.font=fnt(800,54,st.headFont);x.fillText(p.nick,272,128);
  x.fillStyle='#8f97ab';x.font=fnt(600,26,st.font);x.fillText(`${flag(p.country)} ${regionText(p)}${p.region?' • '+p.region:''}`,272,172);
  x.fillStyle=t.color;x.font=fnt(700,30,st.font);x.fillText(`${t.emoji} ${t.name}`,272,222);
  x.fillStyle='#8f97ab';x.font=fnt(600,24,st.font);x.fillText(`${pts} очков`,272,260);
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=1;x.beginPath();x.moveTo(64,300);x.lineTo(W-64,300);x.stroke();
  let bx=64,by=330;
  S.modes.forEach(m=>{const tr=p.tiers[m.id];if(!tr)return;const cc=st.tierColors[tr]||'#8f97ab',w=118,h=58;
    if(bx+w>W-64){bx=64;by+=h+12;}
    x.fillStyle=hexA(cc,.16);rr(x,bx,by,w,h,12);x.fill();x.strokeStyle=hexA(cc,.5);x.lineWidth=1.5;rr(x,bx,by,w,h,12);x.stroke();
    x.fillStyle=cc;x.font=fnt(800,20,st.font);x.fillText(tr,bx+12,by+37);
    x.fillStyle='#e9edf5';x.font=fnt(600,13,st.font);x.fillText(m.name,bx+58,by+37);bx+=w+10;});
  x.fillStyle='#8f97ab';x.font=fnt(600,22,st.font);x.fillText(`${st.logoEmoji} ${st.siteName} • Tier List`,64,H-44);
  x.fillStyle=st.accent;x.font=fnt(800,20,st.headFont);x.textAlign='right';x.fillText('HT / LT RANKING',W-64,H-44);x.textAlign='left';
  try{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=p.nick+'-htl-card.png';a.click();toast('📸 Карточка сохранена');}
  catch(e){toast('⚠️ Скин заблокирован CORS — загрузи PNG-скин вручную в форме игрока',true);}
}

/* ================= СТАРТ ================= */
function renderAll(){applyTheme();renderTabs();renderPage();}
boot();
</script>
</body>
