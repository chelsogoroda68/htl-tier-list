<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTL | Наш Tier List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=Unbounded:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c11; --panel:#12151d;
  --panel2:color-mix(in srgb, var(--panel) 90%, #ffffff 7%);
  --border:color-mix(in srgb, var(--panel) 78%, #ffffff 14%);
  --text:#e9edf5; --muted:#8f97ab;
  --accent:#f59e0b; --radius:14px;
  --font:'Inter',system-ui,sans-serif; --font-head:'Unbounded',var(--font);
  --gold:#ffd700; --silver:#c7d0e0; --bronze:#cd7f32;
  --tw:520px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--border) transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(700px 340px at 85% -60px,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
button{font-family:var(--font)}
body[data-mode="view"] .edit-only{display:none !important}
#editBanner{display:none;background:color-mix(in srgb,#ffb020 16%,var(--panel));border-bottom:1px solid color-mix(in srgb,#ffb020 45%,transparent);padding:9px 22px;font-size:12.5px;font-weight:700;color:#ffd166}
body[data-mode="edit"] #editBanner{display:block}
.live{display:flex;align-items:center;gap:6px;font:800 9px var(--font);letter-spacing:1.4px;color:#3ddc84;flex:0 0 auto}
.live i{width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 10px #3ddc84;animation:pulse 1.7s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
body[data-mode="edit"] .live{display:none}

/* ---------- SPLASH ---------- */
#splash{position:fixed;inset:0;z-index:500;background:var(--bg);transition:opacity .6s ease,visibility .6s;cursor:pointer;overflow:hidden}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splashCv{position:absolute;inset:0;width:100%;height:100%}
.sp-logo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:64px;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--accent) 60%,transparent));transition:transform 1s cubic-bezier(.6,-.15,.3,1.15),opacity .8s;animation:spPop .7s cubic-bezier(.2,1.5,.4,1) both}
.sp-logo.pulse{animation:spBreathe 1.5s ease-in-out infinite}
.sp-logo.fly{animation:none;transform:translate(-170vw,-80%) rotate(-30deg) scale(.45);opacity:0}
@keyframes spPop{from{transform:translate(-50%,-50%) scale(.15);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes spBreathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
.sp-bar{position:absolute;left:50%;top:56%;transform:translateX(-50%);width:180px;height:3px;background:var(--border);border-radius:3px;overflow:hidden;transition:opacity .4s}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ff6b6b);transition:width 1.7s cubic-bezier(.4,0,.2,1)}
.sp-bar.go i{width:100%}
.sp-players{--h:min(76vh,35vw,740px);position:absolute;right:0;bottom:0;display:flex;align-items:flex-end;pointer-events:none;z-index:1}
.sp-fig{position:relative;width:calc(var(--h)*.9);height:var(--h);margin-left:calc(var(--h)*-.45);opacity:0;transform:translate(45vw,25%);transition:transform 1.15s cubic-bezier(.2,1,.3,1),opacity .6s}
.sp-fig.s0{margin-left:0;z-index:2;transform-origin:bottom}
.sp-fig.s1{z-index:3}
.sp-fig.s2{z-index:1}
.sp-fig.in{opacity:1;transform:none}
.sp-fig.s0.in,.sp-fig.s2.in{transform:scale(.88)}
.sp-fig.s0,.sp-fig.s2{transform-origin:bottom center}
.sp-fig .bob{width:100%;height:100%;animation:bob 3.4s ease-in-out infinite;transform-origin:bottom center;filter:drop-shadow(0 12px 22px rgba(0,0,0,.75))}
.sp-fig canvas{display:block}
.sp-render{width:100%;height:100%;object-fit:contain;object-position:bottom;display:block}
.sp-fig-fb{width:110px;height:110px;margin:70px auto 0;border-radius:16px;image-rendering:pixelated;border:2px solid color-mix(in srgb,var(--accent) 50%,transparent);display:block}
@keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}
.sp-text{position:absolute;left:50%;top:32%;transform:translate(-50%,16px);font-family:var(--font-head);font-size:clamp(20px,3.4vw,30px);font-weight:800;color:var(--text);opacity:0;transition:opacity .7s,transform .7s;text-align:center;padding:0 20px;z-index:2}
.sp-text.show{opacity:1;transform:translate(-50%,0)}
.sp-enter{position:absolute;left:50%;top:46%;transform:translate(-50%,12px);opacity:0;pointer-events:none;border:1px solid var(--accent);background:var(--accent);color:#0b0d12;font-weight:800;font-size:15px;padding:13px 28px;border-radius:12px;cursor:pointer;transition:opacity .6s,transform .6s;z-index:2}
.sp-enter.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;animation:enterGlow 2s ease-in-out infinite}
.sp-enter:hover{filter:brightness(1.12)}
@media (min-width:901px){
  .sp-text{left:26%;top:36%;width:min(42vw,560px);font-size:clamp(28px,3.2vw,52px);line-height:1.2}
  .sp-enter{left:26%;top:60%}
}
@media (max-width:900px){
  .sp-text{top:16%;width:100%}
  .sp-enter{top:34%;white-space:nowrap}
  .sp-players{--h:min(46vh,58vw);left:50%;right:auto;transform:translateX(-50%)}
}
@keyframes enterGlow{0%,100%{box-shadow:0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 28px rgba(245,158,11,.55)}}

/* ---------- TOPBAR ---------- */
#topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.tb-in{width:min(1240px,100%);margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--font-head);font-weight:800;font-size:18px;color:var(--accent);display:flex;gap:9px;align-items:center;cursor:pointer;white-space:nowrap;padding:16px 8px 16px 0;flex:0 0 auto}
.logo-ico{font-size:19px;transition:.2s}
.logo:hover .logo-ico{transform:rotate(-12deg) scale(1.15)}
.tabwrap{position:relative;display:flex;flex:1;min-width:0}
#tabbar{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;position:relative}
#tabbar::-webkit-scrollbar{display:none}
.tabwrap.can-scroll::after{content:'';position:absolute;right:0;top:4px;bottom:4px;width:44px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--bg));border-radius:10px}
.tab{display:flex;align-items:center;gap:7px;padding:17px 10px;background:none;border:0;color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:color .18s;flex:0 0 auto}
.tab .m-ico{opacity:.65;transition:.18s}
.tab:hover{color:var(--text)}
.tab:hover .m-ico{opacity:1;transform:translateY(-1px)}
.tab.active{color:var(--text)}
.tab-ind{position:absolute;bottom:0;left:0;height:2px;width:0;background:var(--accent);border-radius:2px;box-shadow:0 0 10px var(--accent);transition:left .3s cubic-bezier(.35,1.5,.4,1),width .3s cubic-bezier(.35,1.5,.4,1),opacity .2s;pointer-events:none;opacity:0}
.tab-sep{width:1px;height:22px;background:var(--border);margin:0 7px;flex:0 0 auto;align-self:center}
.m-ico{display:inline-flex;flex:0 0 auto}
.m-ico svg,.m-ico img{width:18px;height:18px;display:block}
.m-ico.txt{font-size:16px;line-height:1}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tb-gear,.tb-sound{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s}
.tb-gear:hover{color:var(--text);border-color:var(--accent);transform:rotate(45deg)}
.tb-gear.active{color:var(--accent);border-color:var(--accent)}
.tb-sound:hover{color:var(--text);border-color:var(--accent)}
.tb-sound.active{color:#3ddc84;border-color:#3ddc84}
.dd{position:relative}
.dd-btn{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:9px 13px;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s}
.dd-btn:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.dd-btn.active{color:var(--text);border-color:var(--accent)}
.dd-caret{font-size:10px;color:var(--muted);transition:transform .2s}
.dd.open .dd-caret{transform:rotate(180deg)}
.dd-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 16px 40px rgba(0,0,0,.55);z-index:60}
.dd.open .dd-menu{display:flex;flex-direction:column;gap:2px;animation:ddIn .18s ease}
@keyframes ddIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dd-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;text-align:left;width:100%;transition:.12s}
.dd-item:hover{background:var(--panel2);color:var(--text)}
.dd-item.active{color:var(--text);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.dd-item .m-ico{opacity:.8}

main{max-width:1240px;margin:0 auto;padding:0 22px}
#content{padding:20px 0 46px}
#footer{padding:0 22px 30px;text-align:center;color:var(--muted);font-size:12px}
#footer a{color:var(--muted);text-decoration:none;font-size:11px;opacity:.6}
#footer a:hover{opacity:1;color:var(--accent)}
.note{background:color-mix(in srgb,var(--accent) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:var(--radius);padding:11px 15px;font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.55}
.empty{padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);font-size:13.5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-width:200px;flex:1;max-width:340px}
.search input{background:none;border:0;outline:0;color:var(--text);font:500 13px var(--font);width:100%}
.f-sel{width:auto !important;min-width:140px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#0b0d12}
.btn-accent:hover{filter:brightness(1.1)}
.btn-danger{background:color-mix(in srgb,#ff4655 16%,var(--panel2));border-color:color-mix(in srgb,#ff4655 45%,transparent);color:#ff8a94}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}

.thead{display:flex;align-items:center;gap:14px;padding:6px 16px 10px;color:var(--muted);font:800 10px var(--font);letter-spacing:1.4px;text-transform:uppercase;border-bottom:1px solid var(--border);margin-bottom:10px}
.thead .col-rank,.thead .col-region,.thead .col-tiers,.thead .col-info{display:flex;align-items:center}
.thead .col-region{justify-content:center}
.thead .col-tiers{justify-content:flex-start}
.ava-spacer{width:46px;flex:0 0 auto}
.row{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s;position:relative;animation:rowIn .45s ease backwards}
@keyframes rowIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.row:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 42%,transparent);box-shadow:0 10px 26px rgba(0,0,0,.38)}
.col-rank{width:34px;flex:0 0 auto}
.rankb{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;font:800 15px var(--font-head);color:var(--muted)}
.rankb.r1{background:linear-gradient(135deg,#ffd700,#b8860b);color:#241a00;box-shadow:0 0 16px rgba(255,215,0,.25)}
.rankb.r2{background:linear-gradient(135deg,#e8edf5,#9aa7bd);color:#1a1f28}
.rankb.r3{background:linear-gradient(135deg,#e08a3c,#8c4a12);color:#1a0d00}
.col-info{flex:1;min-width:0}
.p-name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-title{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.p-title b{color:var(--c);font-weight:700}
.p-title .pts{font-variant-numeric:tabular-nums}
.tag{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.ava{width:46px;height:46px;border-radius:9px;image-rendering:pixelated;background:var(--panel2);border:1px solid var(--border);object-fit:cover;flex:0 0 auto}
.col-region{width:84px;flex:0 0 auto;display:flex;justify-content:center}
.rgn{min-width:46px;text-align:center;padding:6px 0;border-radius:7px;font:800 12px var(--font)}
.col-tiers{width:var(--tw);flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap}
.tb{width:44px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:9px;background:#0c0f15;border:1px solid var(--border);flex:0 0 auto}
.tb .m-ico svg,.tb .m-ico img{width:17px;height:17px}
.tb-lbl{font:800 9.5px var(--font);color:var(--c);letter-spacing:.3px}
.tb.empty{border-style:dashed}
.tb.empty .m-ico{opacity:.3}
.tb.big{width:58px;padding:8px 0 6px}
.tb.big .m-ico svg,.tb.big .m-ico img{width:24px;height:24px}
.tb.big .tb-lbl{font-size:12.5px}
body[data-compact="true"] .row{padding:8px 12px;margin-bottom:6px}
body[data-compact="true"] .ava{width:38px;height:38px}
body[data-compact="true"] .ava-spacer{width:38px}
@media (max-width:760px){
  .th-region,.col-region,.thead .col-region{display:none}
  .thead,.row{gap:10px}
  .th-tiers,.col-tiers{width:auto;flex:1}
  main{padding:0 12px}
}

.ed-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ed-tab{border-radius:999px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--muted);transition:.15s}
.ed-tab:hover{color:var(--text)}
.ed-tab.active{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--text)}
.ed-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.ed-card h3{font-family:var(--font-head);font-size:13.5px;margin-bottom:14px;display:flex;gap:8px;align-items:center;font-weight:700}
.ed-hint{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.55}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.field label{display:block;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 11px;font:500 13px var(--font);outline:none;transition:.15s}
.inp:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.5;font-family:'JetBrains Mono',monospace;font-size:12px}
input[type="color"]{width:44px;height:35px;padding:2px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;flex:0 0 auto}
input[type="range"]{accent-color:var(--accent);width:100%}
.ed-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--panel2);flex-wrap:wrap}
.ed-row .grow{flex:1;min-width:140px}
.icon-inp{width:170px !important;flex:0 0 auto;font-size:11px !important}
.num-inp{width:92px !important;flex:0 0 auto}
.drag{cursor:grab;color:var(--muted);font-size:15px;user-select:none}
.icon-btn{width:31px;height:31px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex:0 0 auto}
.icon-btn:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.icon-btn.danger:hover{color:#ff8a94;border-color:#ff4655}
.sw{appearance:none;width:40px;height:22px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.sw:checked{background:color-mix(in srgb,var(--accent) 60%,var(--panel2));border-color:var(--accent)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
.sw:checked::after{left:20px;background:#fff}
.sw-row{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;cursor:pointer}
.switches{display:flex;flex-wrap:wrap;gap:16px;margin-top:15px;align-items:center}
.tier-colors{display:flex;flex-wrap:wrap;gap:10px}
.tc{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:6px 8px}
.grid-add{display:flex;gap:8px;margin-bottom:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:12px;color:var(--muted);font-weight:600}
.stat b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.chip button{background:none;border:0;color:inherit;cursor:pointer;font-size:11px;opacity:.8}
.tag-add{display:flex;gap:8px}
.prev-img{width:52px;height:52px;border-radius:9px;object-fit:cover;border:1px solid var(--border);image-rendering:pixelated;background:var(--panel2)}
.file-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.prose{line-height:1.75;font-size:14px}
.prose h1,.prose h2,.prose h3{font-family:var(--font-head);margin:18px 0 9px}
.prose h1{font-size:22px}.prose h2{font-size:17px;color:var(--accent)}.prose h3{font-size:14.5px}
.prose h2:first-child,.prose h3:first-child{margin-top:2px}
.prose p{margin:8px 0}
.prose ul,.prose ol{margin:8px 0 8px 22px}
.prose li{margin:4px 0}
.prose a{color:var(--accent)}
.prose hr{border:0;border-top:1px solid var(--border);margin:16px 0}
.prose blockquote{border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 10px 10px 0;padding:9px 14px;margin:10px 0;color:var(--muted);font-style:italic}
.callout{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--cc) 9%,var(--panel2));border:1px solid color-mix(in srgb,var(--cc) 38%,transparent);border-left:3px solid var(--cc);border-radius:10px;padding:11px 14px;margin:10px 0;font-size:13px;line-height:1.6}
.callout .ci{font-size:15px;flex:0 0 auto}

function iconHTML(icon,fbKey=''){

  if(ic.startsWith('<'))return `<span class="m-ico">${ic}</span>`;

  return `<span class="m-ico txt">${ic}</span>`;

let SOUND_ON=localStorage.getItem(SOUND_KEY)==='1';
let AC=null,NOISE_BUF=null;

const KIT_AUDIO_FILES={
  vanilla:['sounds/vanilla.ogg','sounds/vanilla.mp3'],
  sword:  ['sounds/sword.ogg','sounds/sword.mp3'],
  uhc:    ['sounds/uhc.ogg','sounds/uhc.mp3'],
  pot:    ['sounds/pot.ogg','sounds/pot.mp3'],
  smp:    ['sounds/smp.ogg','sounds/smp.mp3'],
  axe:    ['sounds/axe.ogg','sounds/axe.mp3'],
  mace:   ['sounds/mace.ogg','sounds/mace.mp3'],
  cart:   ['sounds/cart.ogg','sounds/cart.mp3'],
  spear:  ['sounds/spear.ogg','sounds/spear.mp3'],
  overall:['sounds/overall.ogg','sounds/overall.mp3'],
  top:    ['sounds/top.ogg','sounds/top.mp3'],
  click:  ['sounds/click.ogg','sounds/click.mp3']
};
const AUDIO_CACHE={};

function tryPlayFile(key,vol=0.45){
  const list=KIT_AUDIO_FILES[key];
  if(!list)return false;
  if(AUDIO_CACHE[key]===false)return false;
  if(AUDIO_CACHE[key]){
    try{
      const snd=AUDIO_CACHE[key].cloneNode();
      snd.volume=Math.min(1,Math.max(0,vol));
      snd.play().catch(()=>{});
      return true;
    }catch(e){return false;}
  }
  let idx=0;
  const tryNext=()=>{
    if(idx>=list.length){AUDIO_CACHE[key]=false;return;}
    const a=new Audio(list[idx++]);
    a.preload='auto';
    a.addEventListener('canplaythrough',()=>{
      if(AUDIO_CACHE[key])return;
      AUDIO_CACHE[key]=a;
      const snd=a.cloneNode();
      snd.volume=Math.min(1,Math.max(0,vol));
      snd.play().catch(()=>{});
    },{once:true});
    a.addEventListener('error',tryNext,{once:true});
    a.load();
  };
  tryNext();
  return false;
}

function ensureAC(){
  if(!AC){
    try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  }
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  if(AC&&!NOISE_BUF){
    const len=AC.sampleRate*0.6;
    NOISE_BUF=AC.createBuffer(1,len,AC.sampleRate);
    const d=NOISE_BUF.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }
}

function playClick(pitch=1,vol=0.06){
  if(!SOUND_ON)return;
  if(tryPlayFile('click',vol*4))return;
  ensureAC();
  if(!AC||AC.state!=='running')return;
  try{
    const t=AC.currentTime;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(520*pitch,t);
    o.frequency.exponentialRampToValueAtTime(140*pitch,t+0.032);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.036);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+0.04);
  }catch(e){}
}

function playNoise(t,dur,type,freq,q,vol,endFreq){
  if(!NOISE_BUF)return;
  const src=AC.createBufferSource();
  src.buffer=NOISE_BUF;
  const flt=AC.createBiquadFilter();
  flt.type=type;
  flt.frequency.setValueAtTime(freq,t);
  if(endFreq)flt.frequency.exponentialRampToValueAtTime(endFreq,t+dur);
  flt.Q.value=q||1;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(flt);flt.connect(g);g.connect(AC.destination);
  src.start(t);src.stop(t+dur+0.02);
}

function playKitSound(kitId,isHover=false){
  if(!SOUND_ON)return;
  if(tryPlayFile(kitId,isHover?0.24:0.5))return;
  ensureAC();
  if(!AC||AC.state!=='running')return;
  const t=AC.currentTime;
  const v=isHover?0.45:1;

  try{
    switch(kitId){
      case 'vanilla':{
        [1318.5,1760,2349].forEach((f,i)=>{
          const o=AC.createOscillator(),g=AC.createGain();
          o.type='sine';
          const st=t+i*0.025;
          o.frequency.setValueAtTime(f,st);
          o.frequency.exponentialRampToValueAtTime(f*1.03,st+0.18);
          g.gain.setValueAtTime(0.0001,st);
          g.gain.linearRampToValueAtTime(0.045*v,st+0.006);
          g.gain.exponentialRampToValueAtTime(0.0001,st+0.22);
          o.connect(g);g.connect(AC.destination);
          o.start(st);o.stop(st+0.24);
        });
        break;
      }
      case 'sword':{
        playNoise(t,0.13,'bandpass',1400,2.5,0.09*v,3600);
        const o=AC.createOscillator(),g=AC.createGain();
        o.type='triangle';
        o.frequency.setValueAtTime(620,t);
        o.frequency.exponentialRampToValueAtTime(190,t+0.1);
        g.gain.setValueAtTime(0.03*v,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
        o.connect(g);g.connect(AC.destination);
        o.start(t);o.stop(t+0.12);
        break;
      }
      case 'uhc':{
        playNoise(t,0.06,'bandpass',950,1.8,0.07*v,500);
        [1046.5,1318.5].forEach((f,i)=>{
          const o=AC.createOscillator(),g=AC.createGain();
          o.type='sine';
          const st=t+0.04+i*0.045;
          o.frequency.setValueAtTime(f,st);
          g.gain.setValueAtTime(0.045*v,st);
          g.gain.exponentialRampToValueAtTime(0.0001,st+0.16);
          o.connect(g);g.connect(AC.destination);
          o.start(st);o.stop(st+0.17);
        });
        break;
      }
      case 'pot':{
        playNoise(t,0.14,'highpass',2600,1.5,0.06*v,1200);
        [1568,2093,1865].forEach((f,i)=>{
          const o=AC.createOscillator(),g=AC.createGain();
          o.type='sine';
          const st=t+i*0.022;
          o.frequency.setValueAtTime(f,st);
          g.gain.setValueAtTime(0.035*v,st);
          g.gain.exponentialRampToValueAtTime(0.0001,st+0.09);
          o.connect(g);g.connect(AC.destination);
          o.start(st);o.stop(st+0.1);
        });
        break;
      }
      case 'smp':{
        const o=AC.createOscillator(),g=AC.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(320,t);
        o.frequency.exponentialRampToValueAtTime(780,t+0.09);
        o.frequency.exponentialRampToValueAtTime(420,t+0.2);
        g.gain.setValueAtTime(0.05*v,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.21);
        o.connect(g);g.connect(AC.destination);
        o.start(t);o.stop(t+0.22);
        break;
      }
      case 'axe':{
        playNoise(t,0.11,'lowpass',900,1.2,0.09*v,220);
        const o=AC.createOscillator(),g=AC.createGain();
        o.type='triangle';
        o.frequency.setValueAtTime(240,t);
        o.frequency.exponentialRampToValueAtTime(75,t+0.12);
        g.gain.setValueAtTime(0.075*v,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
        o.connect(g);g.connect(AC.destination);
        o.start(t);o.stop(t+0.14);
        break;
      }
      case 'mace':{
        playNoise(t,0.18,'lowpass',600,1.5,0.1*v,120);
        const o=AC.createOscillator(),g=AC.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(165,t);
        o.frequency.exponentialRampToValueAtTime(42,t+0.22);
        g.gain.setValueAtTime(0.11*v,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
        o.connect(g);g.connect(AC.destination);
        o.start(t);o.stop(t+0.25);
        break;
      }
      case 'cart':{
        playNoise(t,0.14,'bandpass',1800,5,0.075*v,1100);
        const o=AC.createOscillator(),g=AC.createGain();
        o.type='triangle';
        o.frequency.setValueAtTime(460,t);
        o.frequency.setValueAtTime(580,t+0.045);
        g.gain.setValueAtTime(0.035*v,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
        o.connect(g);g.connect(AC.destination);
        o.start(t);o.stop(t+0.12);
        break;
      }
      case 'spear':{
        playNoise(t,0.15,'bandpass',2200,3.5,0.08*v,4500);
        const o=AC.createOscillator(),g=AC.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(880,t);
        o.frequency.exponentialRampToValueAtTime(340,t+0.13);
        g.gain.setValueAtTime(0.04*v,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
        o.connect(g);g.connect(AC.destination);
        o.start(t);o.stop(t+0.15);
        break;
      }
      case 'top':
      case 'overall':{
        const f=kitId==='top'?1174.6:987.7;
        const o=AC.createOscillator(),g=AC.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(f,t);
        o.frequency.setValueAtTime(f*1.25,t+0.045);
        g.gain.setValueAtTime(0.045*v,t);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
        o.connect(g);g.connect(AC.destination);
        o.start(t);o.stop(t+0.15);
        break;
      }
      default:
        playClick(isHover?1.15:0.95,isHover?0.03:0.06);
    }
  }catch(e){}
}

function playLevelUp(){
  if(!SOUND_ON)return;

    g.gain.exponentialRampToValueAtTime(0.0001,st+0.25);

const SV_SRCS=[
  'https://chelsogoroda68.github.io/htl-tier-list/skinview3d.bundle.js',

function loadSkinview(){
  if(window.skinview3d&&window.skinview3d.SkinViewer)return Promise.resolve();
  if(svPromise)return svPromise;
  svPromise=new Promise((res,rej)=>{
    let i=0;
    const next=()=>{
      if(i>=SV_SRCS.length){rej(new Error('skinview3d не загрузился ни с одного источника'));return;}
      const sc=document.createElement('script');
      sc.src=SV_SRCS[i++];
      sc.onload=()=>{(window.skinview3d&&window.skinview3d.SkinViewer)?res():next();};
      sc.onerror=()=>{sc.remove();next();};
      document.head.appendChild(sc);
    };
    next();
  });
  return svPromise;
}
function skinExists(url){return new Promise(res=>{const i=new Image();i.onload=()=>res(url);i.onerror=()=>res(null);i.src=url;});}
async function pickSkinURL(p,c){
  const cand=[];
  if(c.skin)cand.push(c.skin);
  if(p.skin)cand.push(p.skin);
  cand.push('https://mc-heads.net/skin/'+encodeURIComponent(p.nick));
  for(const u of cand){const ok=await skinExists(u);if(ok)return ok;}
  return null;
}
function figSize(){
  const wide=innerWidth>900;
  const h=Math.round(wide?Math.min(innerHeight*0.76,innerWidth*0.35,740):Math.min(innerHeight*0.46,innerWidth*0.58));
  return {w:Math.round(h*0.9),h};
}
function makeViewer(cv,url,c,i){
  const {w,h}=figSize();
  const v=new skinview3d.SkinViewer({canvas:cv,width:w,height:h});
  v.pixelRatio=Math.min(devicePixelRatio||1,2);
  v.fov=28;v.zoom=1.22;
  v.globalLight.intensity=2.7;v.cameraLight.intensity=1;
  const rim=v.cameraLight.clone();
  rim.color.set(S.settings.accent);rim.intensity=6;rim.position.set(c.turn>0?-30:30,12,-18);
  v.scene.add(rim);
  v.animation=new skinview3d.FunctionAnimation((player,t)=>{
    const k=player.skin,b=Math.sin(t*1.6+i*1.3);
    k.head.rotation.set(c.head[0]+b*0.025,c.head[1],c.head[2]);
    k.rightArm.rotation.set(c.right[0],c.right[1],c.right[2]-b*0.04);
    k.leftArm.rotation.set(c.left[0],c.left[1],c.left[2]+b*0.04);
    k.rightLeg.rotation.set(...c.rleg);
    k.leftLeg.rotation.set(...c.lleg);
  });
  v.playerObject.rotation.y=c.turn;
  v.playerObject.position.y=-3.5;
  v.loadSkin(url);
  return v;
}
async function buildFigure(fig,bob,p,c,i){
  const custom=c.render&&await skinExists(c.render);
  if(custom){
    const img=document.createElement('img');img.className='sp-render';img.src=custom;img.alt=p.nick;
    bob.appendChild(img);return;
  }
  const cv=document.createElement('canvas');
  try{
    await loadSkinview();
    const url=await pickSkinURL(p,c);
    if(!url)throw new Error('нет скина для '+p.nick);
    bob.appendChild(cv);
    viewers.push(makeViewer(cv,url,c,i));
  }catch(e){
    console.warn('⚠️ fallback для',p.nick,'-',e.message);
    cv.remove();
    const img=document.createElement('img');
    img.className='sp-fig-fb';
    img.src=`https://mc-heads.net/avatar/${encodeURIComponent(p.nick)}/120`;
    img.alt=p.nick;
    img.onerror=()=>{img.onerror=null;img.src=window.DEFAULT_AVA;};
    bob.appendChild(img);
  }
}
async function buildPlayers(instant){
  const wrap=$('#spPlayers');if(wrap._built)return;wrap._built=true;
  const list=SPLASH_PLAYERS.map(c=>{const p=byId(c.id);return p?{p,c}:null;}).filter(Boolean);
  const made=list.map(({p,c},i)=>{
    const fig=document.createElement('div');fig.className='sp-fig s'+c.slot;
    fig.style.order=c.slot;
    const bob=document.createElement('div');bob.className='bob';bob.style.animationDelay=(i*0.7)+'s';
    fig.appendChild(bob);wrap.appendChild(fig);
    return {fig,bob,p,c};
  });
  for(let i=0;i<made.length;i++){
    const {fig,bob,p,c}=made[i];
    await buildFigure(fig,bob,p,c,i);
    if(instant)fig.classList.add('in');
    else setTimeout(()=>fig.classList.add('in'),150+i*450);
  }
}

function showSplash(){
  const s=$('#splash');if(!s)return;
  $('#spLogo').textContent=S.settings.logoEmoji;
  startSplashFX(()=>!splashDone);
  loadSkinview().catch(()=>{});
  const final=()=>{
    spTimers.forEach(clearTimeout);spTimers=[];
    $('#spBar').style.opacity=0;
    const lg=$('#spLogo');lg.classList.remove('pulse');lg.classList.add('fly');
    buildPlayers(true);
    setTimeout(()=>{$('#spText').classList.add('show');},600);
    setTimeout(()=>{$('#spEnter').classList.add('show');},1100);
    spPhase=9;
  };
  s.addEventListener('click',e=>{
    if(e.target.closest('#spEnter'))return;
    if(spPhase<9)final();
  });
  $('#spEnter').addEventListener('click',e=>{e.stopPropagation();dismissSplash();});
  if(new URLSearchParams(location.search).has('nointro')||matchMedia('(prefers-reduced-motion: reduce)').matches){final();return;}
  requestAnimationFrame(()=>$('#spBar').classList.add('go'));
  const T=(fn,ms)=>spTimers.push(setTimeout(fn,ms));
  const N=SPLASH_PLAYERS.length;
  T(()=>{spPhase=1;$('#spBar').style.opacity=0;$('#spLogo').classList.add('pulse');},1800);
  T(()=>{spPhase=2;$('#spLogo').classList.remove('pulse');$('#spLogo').classList.add('fly');},2600);
  T(()=>{spPhase=3;buildPlayers(false);},3000);
  T(()=>{spPhase=4;$('#spText').classList.add('show');},3000+N*500+1200);
  T(()=>{spPhase=5;$('#spEnter').classList.add('show');},3000+N*500+1700);
}
function dismissSplash(){
  splashDone=true;
  $('#splash').classList.add('hide');
  playLevelUp();
  setTimeout(()=>{viewers.forEach(v=>{try{v.dispose();}catch(e){}});viewers=[];},700);
}
function startSplashFX(alive){
  const cv=$('#splashCv');if(!cv)return;
  const x=cv.getContext('2d');
  const cols=Object.values(S.settings.tierColors).concat([S.settings.accent]);
  const P=[];
  for(let i=0;i<52;i++)P.push({x:Math.random(),y:Math.random()-1,s:2+Math.random()*5,v:.0016+Math.random()*.004,c:cols[i%cols.length],a:.2+Math.random()*.5,tw:Math.random()<.35?Math.random()*6:0});
  function frame(t){
    if(!alive()){cv.width=cv.height=0;return;}
    const w=cv.width=cv.clientWidth,h=cv.height=cv.clientHeight;
    x.clearRect(0,0,w,h);
    P.forEach(p=>{
      p.y+=p.v;if(p.y>1.05){p.y=-.05;p.x=Math.random();}
      x.globalAlpha=p.tw?p.a*(.45+.55*Math.abs(Math.sin(t*.002+p.tw))):p.a;
      x.fillStyle=p.c;x.fillRect(Math.round(p.x*w),Math.round(p.y*h),p.s,p.s);
    });
    x.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function normalizePage(p){

  p.blocks=p.blocks.map(b=>({id:b.id||uid(),...b}));
  p.updated=p.updated||Date.now();
  return p;
}
function upgradeIcon(m){
  const ic=String(m.icon||'').trim();
  if(!ic)return OFFICIAL[m.id]||'🎮';
  if(!ic.startsWith('<')&&!ic.startsWith('http'))return OFFICIAL[m.id]||ic;
  if(ic.startsWith('<')&&OLD_DEFAULT_ICONS[m.id]===ic)return OFFICIAL[m.id]||ic;
  return m.icon;
}
function normalize(o){
  const d=clone(DEFAULTS);
  if(!o||typeof o!=='object')return d;
  d.settings=Object.assign(clone(DEFAULTS.settings),o.settings||{});
  d.settings.tierColors=Object.assign(clone(DEFAULTS.settings.tierColors),(o.settings||{}).tierColors||{});
  d.points=Object.assign(clone(DEFAULTS.points),o.points||{});
  ['titles','modes','nav','pages','players'].forEach(k=>{if(Array.isArray(o[k]))d[k]=o[k];});
  if(Array.isArray(o.grids))d.grids=o.grids.map(g=>({id:g.id||uid(),name:g.name||'Сетка',icon:g.icon||'🏆',auto:!!g.auto,autoCount:Math.max(1,+g.autoCount||3),players:Array.isArray(g.players)?g.players:[]}));
  d.modes.forEach(m=>{m.icon=upgradeIcon(m);});
  d.pages=d.pages.map(normalizePage);
  d.players.forEach(p=>{p.tiers=p.tiers||{};p.tags=p.tags||[];p.bio=p.bio||'';});
  d.nav=d.nav.filter(n=>n&&(n.kind==='top'||n.kind==='overall'||(n.kind==='mode'&&d.modes.some(m=>m.id===n.ref))||(n.kind==='page'&&d.pages.some(p=>p.id===n.ref))));
  if(!d.nav.some(n=>n.kind==='top'))d.nav.unshift({kind:'top'});
  if(!d.nav.some(n=>n.kind==='overall'))d.nav.splice(1,0,{kind:'overall'});
  d._seeded=!!o._seeded;
  return d;
}

let DATA_HASH='';
async function boot(){
  let loaded=false;
  if(EDIT_MODE){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(d){S=normalize(d);loaded=true;toast('✏️ Продолжаем твой черновик');}}catch(e){}}
  if(!loaded){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const txt=await r.text();DATA_HASH=txt.length+':'+txt.slice(0,300);S=normalize(JSON.parse(txt));loaded=true;}catch(e){}}
  if(!loaded){try{const l=JSON.parse(localStorage.getItem(KEY)||'null');if(l){S=normalize(l);loaded=true;}}catch(e){}}
  if(!loaded)S=clone(DEFAULTS);
  seedPages();renderAll();applyHash();
  showSplash();updateSoundBtn();
  if(!EDIT_MODE)startPolling();
}
function startPolling(){
  setInterval(async()=>{
    try{
      const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
      const txt=await r.text();const h=txt.length+':'+txt.slice(0,300);
      if(DATA_HASH&&h!==DATA_HASH){DATA_HASH=h;S=normalize(JSON.parse(txt));renderAll();toast('🔄 Данные обновлены!');}
    }catch(e){}
  },60000);
}

function navMeta(n){
  if(n.kind==='top')return{icon:n.icon||'🏆',label:n.label||'Топ / Сетки',page:'top',fb:'overall',soundKey:'top'};
  if(n.kind==='overall')return{icon:n.icon||OFFICIAL.overall,label:n.label||'Overall',page:'overall',fb:'overall',soundKey:'overall'};
  if(n.kind==='mode'){const m=mode(n.ref);return m?{icon:m.icon,label:m.name,page:m.id,fb:m.id,soundKey:m.id}:null;}
  if(n.kind==='page'){const p=page(n.ref);return p?{icon:p.icon,label:p.title,page:p.id,fb:'',soundKey:'click'}:null;}
  return null;
}
function updateScrollFade(){
  const w=$('#tabwrap'),t=$('#tabbar');
  if(!t||!w)return;
  w.classList.toggle('can-scroll',t.scrollWidth>t.clientWidth+4);
}
function updateIndicator(center){
  const bar=$('#tabbar'),ind=$('#tabInd');
  const act=bar?bar.querySelector('.tab.active'):null;
  if(!bar||!ind)return;
  if(!act){ind.style.opacity=0;return;}
  ind.style.opacity=1;
  ind.style.left=act.offsetLeft+'px';
  ind.style.width=act.offsetWidth+'px';
  if(center){
    const x=act.offsetLeft-bar.clientWidth/2+act.offsetWidth/2;
    bar.scrollTo({left:Math.max(0,Math.min(x,bar.scrollWidth)),behavior:'smooth'});
  }
}
function renderTabs(){
  const pnav=S.settings.pagesInNav||'dropdown';
  const items=S.nav.map(n=>({n,m:navMeta(n)})).filter(x=>x.m&&(pnav==='tabs'||x.n.kind!=='page'));
  const main=items.filter(x=>x.n.kind!=='mode'),kit=items.filter(x=>x.n.kind==='mode');
  const tabBtn=({n,m})=>`<button class="tab${UI.page===m.page?' active':''}" data-act="goto" data-id="${esc(m.page)}" data-sound="${esc(m.soundKey)}">${iconHTML(m.icon,m.fb)}<span>${esc(m.label)}</span></button>`;
  const bar=$('#tabbar');
  bar.innerHTML=main.map(tabBtn).join('')+(main.length&&kit.length?'<div class="tab-sep"></div>':'')+kit.map(tabBtn).join('')+'<div class="tab-ind" id="tabInd"></div>';
  requestAnimationFrame(()=>{updateScrollFade();updateIndicator(false);});

  const dd=$('#pagesDD'),menu=$('#ddMenu'),btn=$('#ddBtn');

function animatePoints(){
  if(!UI.animatePts)return;
  UI.animatePts=false;
  const els=[...document.querySelectorAll('.pts[data-pts]')];
  if(!els.length||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const start=performance.now(),dur=650;
  els.forEach(el=>el.textContent='0 очк.');
  function step(now){
    const k=Math.min(1,(now-start)/dur),e=1-Math.pow(1-k,3);
    els.forEach(el=>{el.textContent=Math.round(+el.dataset.pts*e)+' очк.';});
    if(k<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

    <button class="btn edit-only" data-act="newPlayer">➕ Игрок</button>
  </div>`;
}
function matchFilter(p){
  const q=UI.search.trim().toLowerCase();
  if(q&&!p.nick.toLowerCase().includes(q)&&!(p.city||'').toLowerCase().includes(q)&&!(p.tags||[]).some(t=>t.toLowerCase().includes(q)))return false;
  if(UI.region&&p.region!==UI.region)return false;
  if(UI.country&&p.country!==UI.country)return false;
  return true;
}
function sortList(arr){
  const a=[...arr];
  if(UI.sort==='nick')return a.sort((x,y)=>x.nick.localeCompare(y.nick));
  if(UI.sort==='best')return a.sort((x,y)=>bestTier(x)-bestTier(y)||points(y)-points(x));
  return a.sort((x,y)=>points(y)-points(x)||x.nick.localeCompare(y.nick));
}

/* ================= СТРАНИЦЫ ================= */
function renderTop(){
  const all=overallSorted(),rankOf=id=>all.findIndex(p=>p.id===id)+1;
  const used=new Set();
  const secs=S.grids.map(g=>{
    const list=g.auto?all.slice(0,+g.autoCount||3):g.players.map(byId).filter(Boolean);
    list.forEach(p=>used.add(p.id));
    const filtered=sortList(list.filter(matchFilter));
    const col=UI.collapsed.has(g.id);
    const body=!filtered.length?`<div class="empty">В этой сетке пока никого нет.</div>`
      :tableHead()+filtered.map((p,i)=>playerRow(p,g.auto?i+1:rankOf(p.id),null,i*35)).join('');
    return `<section style="margin-bottom:26px">
      <div class="page-head">
        <span class="ph-ico">${iconHTML(g.icon)}</span>
        <div><h1>${esc(g.name)}</h1><div class="ph-sub">Игроков: ${filtered.length}</div></div>
        <button class="btn btn-sm" style="margin-left:auto" data-act="toggleGrid" data-id="${esc(g.id)}">${col?'▾ Развернуть':'▴ Свернуть'}</button>
      </div>
      ${col?'':body}
    </section>`;
  }).join('');
  const rest=sortList(S.players.filter(p=>!used.has(p.id)&&matchFilter(p)));
  const restHTML=rest.length?`<section style="margin-bottom:26px"><div class="page-head"><span class="ph-ico">📋</span><div><h1>Остальные игроки</h1><div class="ph-sub">${rest.length}</div></div></div>${tableHead()}${rest.map((p,i)=>playerRow(p,rankOf(p.id),null,i*30)).join('')}</section>`:'';
  return `${filterBar()}${secs||''}${restHTML}${!secs&&!restHTML?'<div class="empty">Ничего не найдено.</div>':''}`;
}
function renderOverall(){
  const list=sortList(overallSorted().filter(matchFilter));
  return `${filterBar()}${S.settings.overallNote?`<div class="note">${esc(S.settings.overallNote)}</div>`:''}${list.length?tableHead()+list.map((p,i)=>playerRow(p,i+1,null,i*30)).join(''):'<div class="empty">Игроков пока нет.</div>'}`;
}
function renderMode(m){
  const ranked=S.players.filter(p=>p.tiers?.[m.id]&&matchFilter(p)).sort((a,b)=>TIERS.indexOf(a.tiers[m.id])-TIERS.indexOf(b.tiers[m.id])||points(b)-points(a));
  const unranked=S.players.filter(p=>!p.tiers?.[m.id]&&matchFilter(p));
  const head=`<div class="page-head">${iconHTML(m.icon,m.id)}<div><h1>${esc(m.name)}</h1><div class="ph-sub">Оценено игроков: ${ranked.length}</div></div></div>`;
  const ur=!unranked.length?'':`<div style="margin-top:24px"><div class="page-head"><span class="ph-ico">⏳</span><div><h1 style="font-size:18px">Unranked</h1><div class="ph-sub">Без тира в этом режиме (${unranked.length})</div></div></div>${unranked.map(p=>playerRow(p,NaN,m.id)).join('')}</div>`;
  return `${filterBar()}${head}${ranked.length?tableHead(m.id)+ranked.map((p,i)=>playerRow(p,i+1,m.id,i*30)).join(''):'<div class="empty">В этом режиме пока никому не выставлен тир.</div>'}${ur}`;
}

/* ================= ПРОИЗВОЛЬНЫЕ СТРАНИЦЫ ================= */
function fmtText(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g,'<br>');
}
function renderTiersTable(){
  return `<table class="pt-table"><thead><tr><th>Тир</th><th>Очки</th></tr></thead><tbody>${TIERS.map(t=>{const c=tierColor(t);return `<tr><td><span class="tag" style="--c:${c}">${t}</span></td><td><b>${+S.points[t]||0}</b> очк.</td></tr>`;}).join('')}</tbody></table>`;
}
function renderTitlesTable(){
  const sorted=[...S.titles].sort((a,b)=>b.min-a.min);
  return `<table class="pt-table"><thead><tr><th>Звание</th><th>От скольких очков</th></tr></thead><tbody>${sorted.map(t=>`<tr><td><b style="color:${esc(t.color||'#e9edf5')}">${esc(t.emoji||'👑')} ${esc(t.name)}</b></td><td><b>${+t.min||0}</b> очк.</td></tr>`).join('')}</tbody></table>`;
}
function renderBlock(b){
  switch(b.type){
    case 'h2':return `<h2>${fmtText(b.text||'')}</h2>`;
    case 'h3':return `<h3>${fmtText(b.text||'')}</h3>`;
    case 'p':return `<p>${fmtText(b.text||'')}</p>`;
    case 'list':{const tag=b.ordered?'ol':'ul';const items=(b.items||[]).filter(x=>String(x||'').trim()).map(x=>`<li>${fmtText(x)}</li>`).join('');return `<${tag}>${items}</${tag}>`;}
    case 'note':{const tn=NOTE_TONES[b.tone]||NOTE_TONES.info;return `<div class="callout" style="--cc:${tn.c}"><span class="ci">${tn.i}</span><div>${fmtText(b.text||'')}</div></div>`;}
    case 'quote':return `<blockquote>${fmtText(b.text||'')}</blockquote>`;
    case 'divider':return `<hr>`;
    case 'tiers':return renderTiersTable();
    case 'titles':return renderTitlesTable();
    case 'html':return b.code||'';
    default:return '';
  }
}
function renderCustomPage(pg){
  const edBtn=EDIT_MODE?`<button class="btn btn-sm edit-only" style="margin-left:auto" data-act="editPageInPlace" data-id="${esc(pg.id)}">✏️ Редактировать страницу</button>`:'';
  return `<div class="page-head"><span class="ph-ico">${iconHTML(pg.icon)}</span><div><h1>${esc(pg.title)}</h1><div class="ph-sub">${pg.subtitle?esc(pg.subtitle)+' · ':''}Обновлено ${fmtDate(pg.updated)}</div></div>${edBtn}</div>
    <div class="ed-card prose">${(pg.blocks||[]).map(renderBlock).join('')||'<p class="muted">Страница пока пуста.</p>'}</div>`;
}

/* ================= РЕДАКТОР СТРАНИЦ ================= */
function openPageEditor(id){
  const pg=page(id);if(!pg)return;
  normalizePage(pg);
  UI.pageEdit={id:pg.id,title:pg.title,icon:pg.icon,subtitle:pg.subtitle||'',blocks:clone(pg.blocks)};
  UI.page='editor';UI.edTab='pages';renderAll();toast('✏️ Редактируем «'+pg.title+'»');
}
function syncPageEditFromDOM(){
  const pe=UI.pageEdit;if(!pe)return;
  const t=$('#peTitle'),ic=$('#peIcon'),sub=$('#peSub');
  if(t)pe.title=t.value;if(ic)pe.icon=ic.value;if(sub)pe.subtitle=sub.value;
  pe.blocks.forEach(b=>{
    const el=document.querySelector(`.blk[data-bid="${b.id}"]`);if(!el)return;
    if(b.type==='h2'||b.type==='h3'||b.type==='p'||b.type==='quote'){const f=el.querySelector('[data-f="text"]');if(f)b.text=f.value;}
    else if(b.type==='list'){const ord=el.querySelector('[data-f="ordered"]'),f=el.querySelector('[data-f="items"]');if(ord)b.ordered=ord.checked;if(f)b.items=f.value.split('\n');}
    else if(b.type==='note'){const tn=el.querySelector('[data-f="tone"]'),f=el.querySelector('[data-f="text"]');if(tn)b.tone=tn.value;if(f)b.text=f.value;}
    else if(b.type==='html'){const f=el.querySelector('[data-f="code"]');if(f)b.code=f.value;}
  });
}
function savePageEdit(){
  const pe=UI.pageEdit;if(!pe)return;
  syncPageEditFromDOM();
  const pg=page(pe.id);if(!pg)return;
  pg.title=(pe.title||'').trim()||'Без названия';
  pg.icon=(pe.icon||'').trim()||'📄';
  pg.subtitle=(pe.subtitle||'').trim();
  pg.blocks=pe.blocks.map(b=>b.type==='list'?{...b,items:(b.items||[]).map(x=>x.trim()).filter(Boolean)}:b);
  pg.updated=Date.now();
  UI.pageEdit=null;save();UI.page=pg.id;renderAll();toast('💾 Страница сохранена');
}

            <div class="grid-add"><select class="inp" id="addGridSel_${gi}"><option value="">+ Выбрать игрока...</option>${S.players.map(p=>`<option value="${p.id}">${esc(p.nick)} (${points(p)} очк.)</option>`).join('')}</select><button class="btn btn-sm" data-act="addGridPlayer" data-gi="${gi}">Добавить</button></div>`}
      </div>`).join('')}
      <button class="btn btn-accent" data-act="addGrid">➕ Добавить сетку</button>
    </div>`;
  }else if(t==='players'){
    body=`<div class="ed-card"><h3>👥 Игроки (${S.players.length})</h3>
      <div class="toolbar"><button class="btn btn-accent" data-act="newPlayer">➕ Новый игрок</button></div>
      ${S.players.map(p=>`<div class="ed-row">
        <img class="ava" style="width:34px;height:34px" src="${esc(skinSrc(p))}" alt="" onerror="this.onerror=null;this.src=window.DEFAULT_AVA">
        <div class="grow"><strong>${esc(p.nick)}</strong> <span class="muted">· ${points(p)} очк. · ${esc(titleFor(points(p)).name)}</span></div>
        <button class="btn btn-sm" data-act="editPlayer" data-id="${esc(p.id)}">✏️</button>
        <button class="icon-btn danger" data-act="delPlayer" data-id="${esc(p.id)}">🗑</button>
      </div>`).join('')}
    </div>`;
  }else if(t==='points'){
    body=`<div class="ed-card"><h3>🧮 Очки за тиры</h3><div class="f-grid">${TIERS.map(k=>`<div class="field"><label><span class="tag" style="--c:${tierColor(k)}">${k}</span></label><input type="number" class="inp" data-pt="${k}" value="${+S.points[k]||0}"></div>`).join('')}</div></div>
    <div class="ed-card"><h3>👑 Звания по очкам</h3>
      ${S.titles.map((tl,i)=>`<div class="ed-row">
        <input class="inp num-inp" data-tl="emoji" data-idx="${i}" value="${esc(tl.emoji||'👑')}">
        <input class="inp grow" data-tl="name" data-idx="${i}" value="${esc(tl.name)}">
        <input type="color" data-tl="color" data-idx="${i}" value="${tl.color||'#8f97ab'}">
        <input type="number" class="inp num-inp" data-tl="min" data-idx="${i}" value="${+tl.min||0}" placeholder="Мин. очки">
        <button class="icon-btn danger" data-act="delTitle" data-idx="${i}">🗑</button>
      </div>`).join('')}
      <button class="btn btn-accent" data-act="addTitle">➕ Добавить звание</button>
    </div>`;
  }else if(t==='data'){
    body=`<div class="ed-card"><h3>💾 Сохранение и перенос на GitHub</h3>
      <div class="ed-hint">1. Нажми <b>«📥 Скачать data.json»</b>.<br>2. В репозитории на GitHub открой файл <code>data.json</code> → нажми карандаш (Edit) → вставь скачанное (или загрузи файл) → <b>Commit changes</b>. Через минуту он обновится у всех.</div>
      <div class="toolbar">
        <button class="btn btn-accent" data-act="exportJSON">📥 Скачать data.json</button>
        <button class="btn" data-act="importJSON">📤 Загрузить JSON</button>
        <button class="btn btn-danger" data-act="resetDemo">🔄 Сбросить до примера</button>
      </div>
      <div class="stats">
        <div class="stat">Игроков: <b>${S.players.length}</b></div>
        <div class="stat">Режимов: <b>${S.modes.length}</b></div>
        <div class="stat">Страниц: <b>${S.pages.length}</b></div>
        <div class="stat">Сеток: <b>${S.grids.length}</b></div>
      </div>
    </div>`;
  }
  return bar+body;
}

/* ================= МОДАЛКА ИГРОКА ================= */
function openPlayerModal(id){
  const p=byId(id);if(!p)return;
  const all=overallSorted(),rk=all.findIndex(x=>x.id===p.id)+1,pts=points(p),ti=titleFor(pts),st=S.settings;
  const headStyle=p.bg?`style="background-image:url('${esc(p.bg)}')"`:'';
  const loc=regionText(p);
  const locHTML=st.showRegions&&(p.country||p.city||p.region)?`<div class="pc-loc">${regionBadge(p)}${loc?`<span class="pc-loc-t">${flag(p.country)} ${esc(loc)}</span>`:''}</div>`:'';
  const bioHTML=p.bio?`<div class="pc-bio">${esc(p.bio)}</div>`:'';
  const cells=S.modes.map(m=>{const t=p.tiers?.[m.id];return `<div class="tg-cell" data-act="gotoModeFromCard" data-id="${esc(m.id)}" data-sound="${esc(m.id)}">${iconHTML(m.icon,m.id)}<span>${esc(m.name)}</span>${tierBadge(m,t)}</div>`;}).join('');
  const ed=EDIT_MODE?`<div class="modal-actions edit-only"><button class="btn btn-accent" data-act="editPlayer" data-id="${esc(p.id)}">✏️ Редактировать</button><button class="btn btn-danger" data-act="delPlayer" data-id="${esc(p.id)}">🗑 Удалить</button></div>`:'';
  $('#pmBody').innerHTML=`<div class="pc-head"${headStyle}><div class="pc-in">
    <img class="pc-ava" src="${esc(skinSrc(p))}" alt="${esc(p.nick)}" onerror="this.onerror=null;this.src=window.DEFAULT_AVA">
    <div>
      <div class="pc-name"><span>${esc(p.nick)}</span><span class="tag" style="--c:var(--accent)">#${rk} Overall</span></div>
      <div class="pc-tags">${tagsHTML(p)}</div>
      <div class="pc-title">${st.showTitles?`<b style="--c:${ti.color}">${esc(ti.emoji)} ${esc(ti.name)}</b>`:''}${st.showPoints?`<span class="muted">${st.showTitles?' · ':''}${pts} очков</span>`:''}</div>
      ${locHTML}
    </div>
  </div></div>${bioHTML}<div class="tiers-grid">${cells}</div>${ed}`;
  setHash('#/player/'+encodeURIComponent(p.id));
  openModal('playerModal');
}

/* ================= ФОРМА ИГРОКА ================= */
function fillSelects(p){
  $('#pfCountry').innerHTML='<option value="">— не указана —</option>'+Object.entries(COUNTRIES).map(([k,v])=>`<option value="${k}"${p.country===k?' selected':''}>${flag(k)} ${v}</option>`).join('');
  $('#pfRegion').innerHTML=REGIONS.map(r=>`<option value="${r}"${p.region===r?' selected':''}>${r}</option>`).join('');
}
function renderPFTags(){
  $('#pfTags').innerHTML=(PF.tags||[]).map((t,i)=>`<span class="chip" style="--c:${tagColor(t)}">${esc(t)}<button data-act="pfDelTag" data-idx="${i}">✕</button></span>`).join('');
}
function renderPFTiers(){
  $('#pfTiers').innerHTML=S.modes.map(m=>`<div class="field"><label style="display:flex;align-items:center;gap:6px">${iconHTML(m.icon,m.id)} ${esc(m.name)}</label><select class="inp" data-pft="${m.id}"><option value="">Unranked</option>${TIERS.map(t=>`<option value="${t}"${PF.tiers?.[m.id]===t?' selected':''}>${t} (${+S.points[t]||0})</option>`).join('')}</select></div>`).join('');
}
function openPlayerForm(id=null){
  const ex=id?byId(id):null;
  PF=ex?clone(ex):{id:uid(),nick:'',country:'RU',city:'',region:'EU',tags:[],bio:'',skin:'',bg:'',tiers:{}};
  $('#pfTitle').textContent=ex?'Редактировать: '+ex.nick:'Новый игрок';
  $('#pfNick').value=PF.nick;$('#pfCity').value=PF.city||'';$('#pfBio').value=PF.bio||'';$('#pfTagInput').value='';
  $('#pfSkinPrev').src=PF.skin||DEFAULT_AVA;$('#pfBgPrev').src=PF.bg||DEFAULT_AVA;
  fillSelects(PF);renderPFTags();renderPFTiers();openModal('playerForm');
}
function pickImg(cb){const inp=$('#pfSkinFile');inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(r.result.length>900000)toast('⚠️ Файл большой — может не влезть в хранилище',true);cb(r.result);};r.readAsDataURL(f);inp.value='';};inp.click();}
function pickBgImg(cb){const inp=$('#pfBgFile');inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f);inp.value='';};inp.click();}
function savePlayerForm(){
  const nick=$('#pfNick').value.trim();if(!nick)return toast('Введи ник игрока',true);
  PF.nick=nick;PF.country=$('#pfCountry').value;PF.city=$('#pfCity').value.trim();PF.region=$('#pfRegion').value;PF.bio=$('#pfBio').value.trim();
  PF.tiers={};document.querySelectorAll('[data-pft]').forEach(sel=>{if(sel.value)PF.tiers[sel.dataset.pft]=sel.value;});
  const i=S.players.findIndex(x=>x.id===PF.id);if(i>=0)S.players[i]=PF;else S.players.push(PF);
  save();closeModal('playerForm');if($('#playerModal').classList.contains('open'))openPlayerModal(PF.id);renderAll();toast('💾 Сохранено');
}

/* ================= РЕНДЕР И РОУТИНГ ================= */
function renderAll(){
  applyTheme();
  $('#logoIco').textContent=S.settings.logoEmoji;$('#logoText').textContent=S.settings.siteName;
  document.title=`${S.settings.siteName} | ${S.settings.subtitle}`;
  $('#footer').innerHTML=`${esc(S.settings.footer)}${EDIT_MODE?'':' · <a href="?edit">Режим редактора</a>'}`;
  renderTabs();
  const c=$('#content');
  if(UI.page==='top')c.innerHTML=renderTop();
  else if(UI.page==='overall')c.innerHTML=renderOverall();
  else if(UI.page==='editor')c.innerHTML=renderEditor();
  else if(page(UI.page))c.innerHTML=renderCustomPage(page(UI.page));
  else if(mode(UI.page))c.innerHTML=renderMode(mode(UI.page));
  else{UI.page='top';c.innerHTML=renderTop();renderTabs();}
  animatePoints();
}
function goto(id){
  if(id==='editor'&&!EDIT_MODE)return;
  if(id!==UI.page){UI.animatePts=true;UI.pageEdit=null;}
  UI.page=id;$('#pagesDD').classList.remove('open');
  setHash('#/'+id);renderAll();
  requestAnimationFrame(()=>updateIndicator(true));
}
function setHash(h){if(location.hash!==h)history.replaceState(null,'',h);}
function applyHash(){
  const h=location.hash.replace(/^#\/?/,'');if(!h)return;
  if(h.startsWith('player/')){const p=byId(decodeURIComponent(h.slice(7)));if(p)openPlayerModal(p.id);return;}
  if(h==='editor'&&!EDIT_MODE)return;
  if(h==='top'||h==='overall'||h==='editor'||mode(h)||page(h)){UI.page=h;renderAll();}
}
addEventListener('hashchange',applyHash);

/* ================= СОБЫТИЯ ================= */
document.addEventListener('click',e=>{
  const dd=$('#pagesDD');if(dd&&!dd.contains(e.target))dd.classList.remove('open');
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='goto'){
    if(el.dataset.sound)playKitSound(el.dataset.sound,false);
    else playClick(1,0.06);
    goto(id);
  }
  else if(a==='gotoModeFromCard'){
    if(el.dataset.sound)playKitSound(el.dataset.sound,false);
    closeModal('playerModal');
    goto(id);
  }
  else if(a==='toggleDD'){playClick(1.1,0.05);dd.classList.toggle('open');}
  else if(a==='closeModal'){playClick(0.9,0.05);closeModal(id);}
  else if(a==='openPlayer'){playClick(1.05,0.06);openPlayerModal(id);}
  else if(a==='toggleGrid'){playClick(1,0.05);UI.collapsed.has(id)?UI.collapsed.delete(id):UI.collapsed.add(id);renderAll();}
  else if(a==='confirmYes'){if(_cf)_cf();_cf=null;closeModal('confirmModal');}
  else if(!EDIT_MODE)return;
  else if(a==='edTab'){UI.pageEdit=null;UI.edTab=el.dataset.tab;renderAll();}
  else if(a==='editPageInPlace'||a==='openPageEdit')openPageEditor(id);
  else if(a==='peAdd'){syncPageEditFromDOM();UI.pageEdit.blocks.push(mkBlock(el.dataset.btype));renderAll();}
  else if(a==='peDel'){syncPageEditFromDOM();UI.pageEdit.blocks.splice(+el.dataset.idx,1);renderAll();}
  else if(a==='peMove'){syncPageEditFromDOM();const bs=UI.pageEdit.blocks,i=+el.dataset.idx,j=i+ +el.dataset.dir;if(j>=0&&j<bs.length){[bs[i],bs[j]]=[bs[j],bs[i]];renderAll();}}
  else if(a==='peSave')savePageEdit();
  else if(a==='peCancel'){UI.pageEdit=null;renderAll();}
  else if(a==='tplPage'){const map={rules:tplRules,calib:tplCalib,changelog:tplChangelog};const pg=(map[el.dataset.tpl]||tplRules)();S.pages.push(pg);S.nav.push({kind:'page',ref:pg.id});save();renderAll();toast('📄 Страница добавлена');}
  else if(a==='newPage'){const pg=mkPage('Новая страница','📄','Описание',[mkBlock('h2'),mkBlock('p')]);S.pages.push(pg);S.nav.push({kind:'page',ref:pg.id});save();openPageEditor(pg.id);}
  else if(a==='delPage')showConfirm('Удалить страницу?',()=>{S.pages=S.pages.filter(p=>p.id!==id);S.nav=S.nav.filter(n=>!(n.kind==='page'&&n.ref===id));if(UI.page===id)UI.page='top';save();renderAll();toast('🗑 Удалено');});
  else if(a==='delNav'){S.nav.splice(+el.dataset.idx,1);save();renderAll();}
  else if(a==='addMode'){const mid='m_'+uid();S.modes.push({id:mid,name:'Новый режим',icon:'⚔️'});S.nav.push({kind:'mode',ref:mid});save();renderAll();}
  else if(a==='delMode'){const m=S.modes[+el.dataset.idx];if(!m)return;showConfirm(`Удалить режим «${m.name}»?`,()=>{S.modes.splice(+el.dataset.idx,1);S.nav=S.nav.filter(n=>!(n.kind==='mode'&&n.ref===m.id));save();renderAll();});}
  else if(a==='addGrid'){S.grids.push({id:uid(),name:'Новая сетка',icon:'🏅',auto:false,autoCount:3,players:[]});save();renderAll();}
  else if(a==='delGrid')showConfirm('Удалить эту сетку?',()=>{S.grids.splice(+el.dataset.gi,1);save();renderAll();});
  else if(a==='addGridPlayer'){const gi=+el.dataset.gi,pid=$('#addGridSel_'+gi).value;if(!pid)return;const g=S.grids[gi];if(!g.players.includes(pid))g.players.push(pid);save();renderAll();}
  else if(a==='rmGridPlayer'){S.grids[+el.dataset.gi].players=S.grids[+el.dataset.gi].players.filter(x=>x!==el.dataset.pid);save();renderAll();}
  else if(a==='newPlayer')openPlayerForm();
  else if(a==='editPlayer')openPlayerForm(id);
  else if(a==='delPlayer'){const p=byId(id);if(!p)return;showConfirm(`Удалить игрока ${p.nick}?`,()=>{S.players=S.players.filter(x=>x.id!==id);S.grids.forEach(g=>g.players=g.players.filter(x=>x!==id));save();closeModal('playerModal');renderAll();toast('🗑 Удалён');});}
  else if(a==='pfAddTag'){const inp=$('#pfTagInput'),v=inp.value.trim();if(!v)return;PF.tags.push(v);inp.value='';renderPFTags();}
  else if(a==='pfDelTag'){PF.tags.splice(+el.dataset.idx,1);renderPFTags();}
  else if(a==='pfSkinPick')pickImg(u=>{PF.skin=u;$('#pfSkinPrev').src=u;});
  else if(a==='pfSkinClear'){PF.skin='';$('#pfSkinPrev').src=DEFAULT_AVA;}
  else if(a==='pfBgPick')pickBgImg(u=>{PF.bg=u;$('#pfBgPrev').src=u;});
  else if(a==='pfBgClear'){PF.bg='';$('#pfBgPrev').src=DEFAULT_AVA;}
  else if(a==='pfSave')savePlayerForm();
  else if(a==='addTitle'){S.titles.push({id:uid(),name:'Новое звание',emoji:'👑',color:'#e9edf5',min:0});save();renderAll();}
  else if(a==='delTitle'){S.titles.splice(+el.dataset.idx,1);save();renderAll();}
  else if(a==='exportJSON'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a2=document.createElement('a');a2.href=url;a2.download='data.json';a2.click();URL.revokeObjectURL(url);toast('📥 Скачан data.json');}
  else if(a==='importJSON')$('#importFile').click();
  else if(a==='resetDemo')showConfirm('Сбросить все данные к примеру по умолчанию?',()=>{localStorage.removeItem(KEY);localStorage.removeItem(DRAFT_KEY);S=clone(DEFAULTS);S._seeded=false;seedPages();save();renderAll();toast('🔄 Сброшено');});
});

/* Звук при наведении на вкладку кита или карточку игрока */
document.addEventListener('mouseover',e=>{
  if(!SOUND_ON)return;
  const tab=e.target.closest('.tab[data-sound]');
  if(tab&&!tab.contains(e.relatedTarget)){
    playKitSound(tab.dataset.sound,true);
  }
});

$('#soundBtn').addEventListener('click',()=>{
  SOUND_ON=!SOUND_ON;
  localStorage.setItem(SOUND_KEY,SOUND_ON?'1':'0');
  updateSoundBtn();
  if(SOUND_ON){ensureAC();playLevelUp();toast('🔊 Звуки включены');}
  else toast('🔇 Звуки выключены');
});

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='qInput'){UI.search=el.value;const pos=el.selectionStart;renderAll();const n=$('#qInput');if(n){n.focus();n.setSelectionRange(pos,pos);}}
  else if(el.dataset.s==='radius')$('#radVal').textContent=el.value;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='fRegion'){UI.region=el.value;renderAll();}
  else if(el.id==='fCountry'){UI.country=el.value;renderAll();}
  else if(el.id==='fSort'){UI.sort=el.value;renderAll();}
  else if(!EDIT_MODE)return;
  else if(el.dataset.s){const k=el.dataset.s;S.settings[k]=el.type==='checkbox'?el.checked:(el.type==='range'?+el.value:el.value);save();renderAll();}
  else if(el.dataset.tc){S.settings.tierColors[el.dataset.tc]=el.value;save();renderAll();}
  else if(el.dataset.m){S.modes[+el.dataset.idx][el.dataset.m]=el.value;save();renderTabs();}
  else if(el.dataset.n){S.nav[+el.dataset.idx][el.dataset.n]=el.value.trim();save();renderTabs();}
  else if(el.dataset.g){const g=S.grids[+el.dataset.gi],k=el.dataset.g;g[k]=el.type==='checkbox'?el.checked:(el.type==='number'?Math.max(1,+el.value||1):el.value);save();renderAll();}
  else if(el.dataset.pt){S.points[el.dataset.pt]=+el.value||0;save();}
  else if(el.dataset.tl){const k=el.dataset.tl;S.titles[+el.dataset.idx][k]=k==='min'?+el.value||0:el.value;save();}
});
$('#pfTagInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.querySelector('[data-act="pfAddTag"]').click();}});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=normalize(JSON.parse(r.result));save();renderAll();toast('📤 Импортировано');}catch{toast('Ошибка в JSON',true);}};r.readAsText(f);e.target.value='';});

let dragSrc=null;
document.addEventListener('dragstart',e=>{const r=e.target.closest('[data-drag]');if(!r||!EDIT_MODE)return;dragSrc={kind:r.dataset.drag,idx:+r.dataset.idx};e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{if(dragSrc&&e.target.closest('[data-drag="'+dragSrc.kind+'"]'))e.preventDefault();});
document.addEventListener('drop',e=>{const r=e.target.closest('[data-drag]');if(!r||!dragSrc||!EDIT_MODE)return;const k=r.dataset.drag;if(dragSrc.kind!==k)return;const to=+r.dataset.idx,arr=S[k];if(dragSrc.idx===to)return;const [item]=arr.splice(dragSrc.idx,1);arr.splice(to,0,item);dragSrc=null;save();renderAll();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')['playerModal','playerForm','confirmModal'].forEach(closeModal);});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id);}));

boot();
</script>
</body>
</html>
